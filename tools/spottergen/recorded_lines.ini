; ============================================================================
; tools/spottergen/recorded_lines.ini
; The wording a RECORDED spotter pack uses where it cannot use the shipped
; line. elevenlabs.py records every cue as ONE whole clip - nothing is
; stitched at playback, because stitched pieces never sound like one sentence
; - so a recorded line cannot say a value that changes (a position, a gap, a
; trick name, a rider number).
;
; HOW A SHIPPED LINE BECOMES A RECORDED ONE:
;   - optional groups `[...]` are dropped automatically
;     ("Winner[, {tier}]! Champagne's on you." -> "Winner! Champagne's on
;     you."), so most lines need nothing here;
;   - a line that still names a variable once its groups are gone needs a
;     row in this file, and the baker's --selftest fails until it has one.
;
; A row here REPLACES the shipped cue and all its alternates, the same way a
; voice pack owns a cue it defines (SpotterCuePack::mergePhrases): give the
; base key and as many `_2`..`_99` as you want, plus position rows (`_p1`..
; `_last`, below). An empty value mutes the cue in the recorded pack. A
; `;key = line` row is a default-quiet cue (the shipped pack keeps it
; commented out): it is recorded, and left commented out.
;
; Rows may not contain `{` or `[`, except that a row may OPEN with its own
; `[mood]` (a MOOD_TAGS name in elevenlabs.py), which sets that line's tone
; and is not shown. Otherwise moods and pronunciation come from elevenlabs.py
; (mood_for, PRONOUNCE), exactly as for shipped lines.
; ============================================================================
[Cues]

