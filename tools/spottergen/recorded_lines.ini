; it is going - the plugin fires closing/dropping instead of gap_behind
; whenever there is a trend, so gap_behind itself is only the first reading.
; Your place is said by POSITION ROWS (spotter_position_rows.h): a `_p1`..
; `_p10` and `_last` line each, and the cue's own line from P11 down.
