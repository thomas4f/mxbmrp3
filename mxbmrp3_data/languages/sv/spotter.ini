achievement_solo_race = Bara jag då. Ett lopp som ingen annan startade. Du vann. Grattis, antar jag.
achievement_peace_out = Hej då. Tre förare nere och du körde rakt igenom. Hej hej!
achievement_digging = Gräva ett hål. Snurrar på stället. Fortsätt, du når Australien.
achievement_ghost_ride = Förarlös. Du ramlade av och hojen körde vidare utan dig. Den klarar sig själv.
achievement_sandbagger = Sandsäck. Personbästa på sista varvet. Var var det hela loppet?
achievement_palindrome = Palindrom. Samma varvtid baklänges. Konstigt att skryta med, men okej.
achievement_deja_vu = Déjà vu. Två identiska varvtider. Har vi träffats förut?
; Racing extras
achievement_photo_finish = Fotofinish. Under en tiondel! För nära. Mitt hjärta.
achievement_fumes = På ångorna. En procent av en tank. Lever farligt.

