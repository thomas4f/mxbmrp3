; ============================================================================
; mxbmrp3 spotter, Swedish (Beta)
;
; The spotter's lines in Swedish. Used whenever the plugin's language is
; Swedish (Settings > Appearance > Language) and the spotter's voice pack is
; the shipped one, laid over its English: a cue left out here is spoken in
; English. Pick another voice pack in Settings > Spotter and the spotter
; speaks that pack, in English, so no sentence mixes the two languages.
;
; Same format as spotters\default\spotter.ini, which explains every cue and
; {variable}; the lines here keep its keys and variables and change the words.
; [Words] at the end translates the words the plugin puts together itself:
; numbers, "rider", "quicker", the trick names.
;
; With Voice on the system default, the spotter picks an installed Swedish
; Windows voice (Microsoft Bengt or Hedvig) when there is one. Without one,
; the default voice reads these lines in its own accent.
; ============================================================================
[Cues]

