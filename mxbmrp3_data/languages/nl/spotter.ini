achievement_palindrome = Palindroom. Achterstevoren dezelfde tijd. Raar om over op te scheppen, maar goed.
achievement_deja_vu = Déjà Vu. Twee gelijke tijden. Kennen wij elkaar?
achievement_photo_finish = Fotofinish. Minder dan een tiende! Te spannend. Mijn hart.
achievement_fumes = Op de Dampen. Eén procent in de tank. Je leeft gevaarlijk.

