achievement_palindrome = Palindromo. Stesso tempo al contrario. Strano vantarsene, ma va bene.
achievement_deja_vu = Déjà Vu. Due tempi identici. Ci conosciamo?
achievement_photo_finish = Photo Finish. Meno di un decimo! Troppo vicino. Il mio cuore.
achievement_fumes = In Riserva. Un per cento di serbatoio. Vivi pericolosamente.

