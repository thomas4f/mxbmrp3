achievement_sandbagger = Tiefstapler. Persönliche Bestzeit in der letzten Runde. Wo war die im Rennen?
achievement_palindrome = Palindrom. Rückwärts dieselbe Zeit. Komisch, damit anzugeben, aber gut.
achievement_deja_vu = Déjà-vu. Zwei gleiche Zeiten. Kennen wir uns?
achievement_photo_finish = Fotofinish. Unter einer Zehntel! Zu knapp. Mein Herz.
achievement_fumes = Auf dem letzten Tropfen. Ein Prozent im Tank. Du lebst gefährlich.

