achievement_decorator = İç Mimar. Ooo, yeni görünüm. Çok şık.
achievement_dress_up = Artık Senin. Paket kuruldu. Yakışmış.
achievement_stylist = Stilist. Kendi CSS'in. İnek.
achievement_ungrateful = Nankör. Başarım bildirimlerini kapattın. O yüzden yüksek sesle söylüyorum.
achievement_factory_fresh = Fabrikadan Yeni. Her şey varsayılana döndü. Onca emek, gitti.
achievement_prerelease = Erken Erişim. Ön sürüm kanalı. Cesur. Ya da pervasız.
achievement_frame_perfect = Kare Kusursuz. Bu çok kare eder. Gösterişçi.
achievement_phoenix = Anka Kuşu. Masaüstüne çöktükten sonra geri döndün. Bundan bahsetmeyelim.
achievement_test_pilot = Test Pilotu. Deneysel ayarlar. Ne ters gidebilir ki.
achievement_under_hood = Kaputun Altında. Ayar dosyasını elle düzenledin. Hacker.
achievement_backup_plan = B Planı. İstatistik dosyasını elle düzenledin. Gördüm seni. Hileci.
achievement_homebrew = Ev Yapımı. Kendin derledin. Saygı.
achievement_developer = Geliştirici. Geliştirici modu. Hiçbir şeye dokunma.
achievement_night_owl = Gece Kuşu. Gecenin bir yarısı. Git yat.
achievement_anniversary = Yıldönümü. Bütün bunlarla bir yıl. Mutlu yıllar, sanırım.
achievement_solo_race = Demek Sadece Ben. Başka kimsenin başlamadığı bir yarış. Kazandın. Tebrikler, sanırım.
achievement_peace_out = Hoşça Kal. Üç sürücü yerde ve sen dümdüz geçtin. Görüşürüz!
achievement_digging = Çukur Kazmak. Yerinde dönüyorsun. Devam et, Avustralya'ya varırsın.
achievement_ghost_ride = Hayalet Sürüş. Sen düştün, motor sensiz devam etti. Sana ihtiyacı yok.
achievement_sandbagger = Sinsi Yavaş. Son turda kişisel rekor. Yarışta neredeydi bu?
achievement_palindrome = Palindrom. Tersten aynı süre. Bununla övünmek garip, ama peki.
achievement_deja_vu = Déjà Vu. İki aynı süre. Daha önce tanıştık mı?
achievement_photo_finish = Foto Finiş. Saniyenin onda birinden az! Çok yakın. Kalbim.
achievement_fumes = Buharla Gidiyor. Depoda yüzde bir. Tehlikeli yaşıyorsun.

