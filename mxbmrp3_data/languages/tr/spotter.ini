; ============================================================================
; mxbmrp3 spotter, Turkish (Beta)
;
; The spotter's lines in Turkish, used when the plugin's language is Turkish
; and the spotter's voice pack is the shipped one. Same keys and {variables}
; as spotters\default\spotter.ini, which explains each cue; a cue left out
; here is spoken in English. [Words] at the end translates the words the
; plugin puts together itself. Lines keep names and numbers free of case
; endings, since the plugin fills them in as they are. Machine-assisted and
; not yet checked by a native speaker: corrections are welcome (see
; languages\README.md).
; ============================================================================
[Cues]

