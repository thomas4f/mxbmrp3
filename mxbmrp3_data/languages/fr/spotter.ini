; ============================================================================
; mxbmrp3 spotter, French (Beta)
;
; The spotter's lines in French, used when the plugin's language is French
; and the spotter's voice pack is the shipped one. Same keys and {variables}
; as spotters\default\spotter.ini, which explains each cue; a cue left out
; here is spoken in English. [Words] at the end translates the words the
; plugin puts together itself. Machine-assisted and not yet checked by a
; native speaker: corrections are welcome (see languages\README.md).
; ============================================================================
[Cues]

