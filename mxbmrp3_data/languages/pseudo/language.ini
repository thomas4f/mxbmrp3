; ============================================================================
; mxbmrp3 language pack: pseudo (developer test language)
;
; Not a real language. Every string the plugin translates is shown bracketed,
; accented and about a third longer: "Show gap" reads "[Šhöw gåp~~~]". Text
; still in plain English is text that is not translatable yet, and a box that
; overflows is one a longer language will overflow too.
;
; Listed under Settings > Appearance > Language only with developerMode=1 in
; the [Advanced] section of mxbmrp3.ini. It needs no strings.po: the
; transformation is built in.
; ============================================================================

[pack]
name = Pseudo (test)
pseudo = 1
