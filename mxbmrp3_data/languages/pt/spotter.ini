; ============================================================================
; mxbmrp3 spotter, Portuguese (Beta)
;
; The spotter's lines in Portuguese, used when the plugin's language is
; Portuguese and the spotter's voice pack is the shipped one. Same keys and
; {variables} as spotters\default\spotter.ini, which explains each cue; a cue
; left out here is spoken in English. [Words] at the end translates the words
; the plugin puts together itself. Machine-assisted and not yet checked by a
; native speaker: corrections are welcome (see languages\README.md).
; ============================================================================
[Cues]

