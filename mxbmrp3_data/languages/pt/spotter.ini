achievement_digging = Cavando um Buraco. Você está girando no lugar. Continua, vai chegar no Japão.
achievement_ghost_ride = Moto Fantasma. Você caiu e a moto seguiu sem você. Ela não precisa de você.
achievement_sandbagger = Sandbagger. Recorde pessoal na última volta. Onde estava isso na corrida?
achievement_palindrome = Palíndromo. Mesmo tempo de trás para frente. Estranho se gabar disso, mas tudo bem.
achievement_deja_vu = Déjà Vu. Dois tempos iguais. A gente já se conhece?
achievement_photo_finish = Photo Finish. Menos de um décimo! Apertado demais. Meu coração.
achievement_fumes = No Vapor. Um por cento de tanque. Vivendo perigosamente.

