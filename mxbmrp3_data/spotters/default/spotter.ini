; ============================================================================
; mxbmrp3 spotter voice pack: default
;
; Every line the spotter says. Text only: each phrase is read by Windows
; text-to-speech and shown as the subtitle.
;
; TO EDIT, copy this folder to Documents\PiBoSo\<Game>\mxbmrp3\spotters\ and
; edit it there - that copy is applied over the shipped one at startup, so it
; survives a plugin update. Rename the folder (and this file to match) to keep
; both, and pick yours in Settings > Spotter > Voice pack. The RELOAD CONFIG
; hotkey re-reads it without restarting the game.
;
;   <key> = the words             ; absent = never say this one
;   <key> =                       ; empty  = never say this one
;   <key>_2 = an alternative      ; _2.._9, one picked at random per firing
;
; WHAT EVERY CUE AND {VARIABLE} MEANS: docs/spotter-reference.md in the
; plugin's source repository - when each cue fires, which switch mutes it,
; whether it ships silent, and what every variable carries. It is generated
; from the plugin itself, so it cannot fall behind. The authoring guide -
; variables, [optional groups], alternates, recorded packs and the chunk mixer
; - is docs/spotter.md, beside it.
;
; THIS FILE IS THE SPOTTER'S VOCABULARY. Not a set of overrides on something
; hidden - there is no built-in wording behind it. Comment a row out and that
; callout stops happening; delete the file and the spotter has nothing to say.
; Every cue the plugin can speak has a row below, so this is also the index: a
; commented-out row is one that ships silent, and uncommenting it turns it on.
; A test walks this file against the plugin in both directions, so a row naming
; no real cue - or a cue with no row here - fails the build.
;
; Another pack (Settings > Spotter > Voice pack) LAYERS over this one: what it
; defines wins, what it leaves out is answered from here. So a recorded voice
; covering twenty callouts still speaks the rest in these words.
; ============================================================================
;
; ---------------------------------------------------------------------------
; ALTERNATES - the _2.._9 rows below, and how they are used here
; ---------------------------------------------------------------------------
; One row of a cue's set is picked at random every time it fires, so the lines
; you hear twenty times a race stop sounding like a recording. Rules worth
; knowing before you add your own:
;
;   * NUMBER THEM WITHOUT GAPS, from _2. The scan stops at the first missing
;     number, so a _4 with no _3 is simply never spoken. (Checked by the build.)
;   * THE ALTERNATES ARE WHERE THE VARIABLES GET INTERESTING. Each row is a
;     whole template, so the set below deliberately asks for different things:
;     lap_completed has one row about the rider ahead, one about your own lap
;     time, one about the clock. Same moment, different report.
;   * SHORT WHERE IT IS URGENT. rider_left / rider_right stay two words in
;     every row - you need those before the corner, not after it.
;   * NOT EVERY CUE WANTS VARIETY. hotkey_triggered has no alternates on
;     purpose: you press that key to get the same status report every time.
;   * READ EVERY ROW BACK WITH ITS VALUES MISSING, not just with them present.
;     A row whose words sit OUTSIDE its brackets can collapse to a fragment
;     ("{rider_behind} is {gap_to_behind} back." -> "is back." when you lead).
;     docs/spotter-pack-render.md is every row below in both states, generated
;     from this file, which is the fast way to check your own. Capitalisation
;     is not your problem - the line is capitalised after expansion, so a row
;     may open with a {variable}.
;   * A RECORDED PACK THAT REWORDS A CUE REPLACES ITS ALTERNATES TOO, so it
;     can never roll a line it has no clip for.
;
; The wording here is deliberately flat. It is read by a neutral text-to-speech
; voice that cannot sell excitement, and a line written to be shouted lands
; worse from it than a line written to be heard.
;
; A variable this file does not use, because how it reads depends on your
; content rather than on the plugin: {track_name} is the track's own name, so
; on a modded track TTS reads whatever the folder calls it, underscores and
; all. Try it before you keep it:
;
;   session_started_2 = {session_name} is live[ at {track_name}][, {session_length}].
;

; OPTIONAL TITLE. The picker shows this pack's FOLDER name unless the pack says
; otherwise:
;
;   [pack]
;   name = Bill (UK English)
;
; It is a label only -- your pack is still stored and selected by its folder
; name, so retitling it can never reassign anybody's choice. Absent, the folder
; name is used, which is what every pack did before the key existed.
;
[Cues]
;
; The five headings below are the five Callouts switches in Settings > Spotter.
; Turning one off mutes every cue under it immediately; editing here is for the
; finer cut - rewording a line, muting ONE cue, or adding alternates.
;

; ============================================================================
; GENERAL - the session, and your own status
; ============================================================================
; NO LENGTH ON THE RACE LINE. A race reaches session_started a few seconds
; after session_prestart has already said the distance ("On the gate for Race
; 2, eight minutes plus one lap" -> "Race 2 is live, eight minutes plus one
; lap"), and by then it is too late to do anything with the number -- fuel and
; setup are locked. The kind-specific rows below keep it, because practice,
; qualifying and warm up have no gate hold and so never hear a prestart: for
; them this IS the only announcement of the length.
session_started = {session_name} underway.
session_started_2 = {session_name} is live.
practice_started = {session_name} underway[, {session_length}].
quali_started = {session_name} underway[, {session_length}].
warmup_started = {session_name} underway[, {session_length}].
gate_drop = Green green green.
gate_drop_2 = Gate's down, go go go.
gate_drop_3 = We're racing.
session_prestart = {session_name} starting[, {session_length}], get ready.
session_prestart_2 = On the gate[ for {session_name}][, {session_length}].
; The GAP belongs to finished_you, not here. Both fire at the flag, ~20ms
; apart, and this one goes first -- on the Race Over state, before your own
; finish has been recorded -- so it quoted a gap the next sentence then
; corrected (58.9 then 59.7, in a logged race). One fact, one cue.
session_ended = {session_name} complete[, you're P {position}].
session_ended_2 = That's {session_name} done[, P {position}].
session_state = {session_name}, {session_state}.

leader_you = You're the leader now[, {gap_to_behind} to {rider_behind}].
leader_you_2 = You've got the lead[, {gap_to_behind} back to P {position_behind}].
; {laps_remaining} is a bare number, so "to go" pluralises itself and
; "laps left" would not - "one laps left" is how you find that out.
leader_you_3 = P one, the lead is yours[, {laps_remaining} to go].
finished_you = Checkered flag[, P {position}][, {finish_time}][, {gap_to_leader} off the lead].
finished_you_2 = That's the flag[, P {position}][, best lap {best_lap_time}].
penalty_you = Penalty, penalty, {penalty_seconds}[, {penalty_total} in total].
penalty_you_2 = You've picked up a penalty, {penalty_seconds}[, {penalty_total} in total].
penalty_you_3 = Penalty for you, {penalty_seconds}.
penalty_clear_you = Penalty cleared, you're good.
penalty_clear_you_2 = That penalty's gone.
penalty_change = Penalty changed.
disqualified_you = Disqualified.
;retired_you = You're out.
;crashed_you = That's a crash.

fuel_low = Fuel getting low, {fuel_laps}.
fuel_low_2 = Watch the fuel, about {fuel_laps} left.
;fuel_critical = Fuel critical, {fuel_laps}.
pit_entry_you = Entering pit lane.
pit_entry_you_2 = Into the pits.
pit_exit_you = Pit exit, up to speed[, {session_name}][, {session_remaining} left][, on the {setup_name} setup].

hotkey_triggered = {rider_name}[, P {position}][, lap {lap_number}][, {session_remaining} left][, {gap_to_ahead} to {rider_ahead}].
voice_preview = Spotter ready.

; ============================================================================
; TIMING - your pace, your position, and the clock
; ============================================================================

; crossing the line - five ways to report the same moment. Swap the order if
; you would rather hear one of them first; the plugin has no preference.
lap_completed = P {position}[, {gap_to_ahead} to {rider_ahead}][, {trend_ahead} {gained_on_ahead}].
lap_completed_2 = P {position}[, {last_lap_time}][, {gap_to_best_lap} than your best].
; A group can lead the line as well as trail it: with no lap time yet this
; reads "P four, one point one to rider sixty five."
lap_completed_3 = [That's {last_lap_time}, ]P {position}[, {gap_to_behind} to {rider_behind}].
lap_completed_4 = P {position}[, {gap_to_leader} off the lead][, {laps_remaining} to go].
lap_completed_5 = P {position}[, {gap_to_ahead} to {rider_ahead}][, who ran {last_lap_ahead}].
position_gained = Up {positions_changed}.
position_gained_2 = Made up {positions_changed}[, P {position}].
position_gained_3 = Up {positions_changed}, keep it going.
position_lost = Down {positions_changed}.
position_lost_2 = Lost {positions_changed}[, P {position}].
position_lost_3 = Dropped {positions_changed}, settle in.

; crossing a split. The delta variables carry their own direction word
; ("three tenths quicker"), so a line must not add one - "up three tenths
; quicker" is what these rows used to say. A refined key therefore only earns
; its own row when you want a different TONE per case, which is what these two
; are showing; drop them and both cases speak sector_completed.
;sector_completed = Sector {sector_number}, {event_time}[, {trend_ahead} {gained_on_ahead} on {rider_ahead}].
;sector_completed_faster = Sector {sector_number}, {event_time}, {sector_delta_best_lap}. Good.
;sector_completed_slower = Sector {sector_number}, {event_time}, {sector_delta_best_lap}. Tidy that up.

; a sector went better than it ever has this session. Unlike the rows above,
; this compares the sector ON ITS OWN against your best of that sector - so it
; still fires for a great sector inside a scrappy lap, which is the one you
; would never hear about otherwise. Rare by nature, so it ships enabled.
sector_best = Best sector {sector_number}[, {sector_duration}].
sector_best_2 = That's your best sector {sector_number}[, {sector_best_delta} off it].
sector_best_3 = Sector {sector_number} personal best[, {sector_duration}].

; the last split before the line, and you're up on something. Only the
; strongest reference you're actually beating speaks, so a record-pace lap
; doesn't get announced as a session best. {pace_margin} is how far up you are.
on_pace_session_best = On for your session best[, up {pace_margin}].
on_pace_session_best_2 = Session best is on[, you're {pace_margin} up].
on_pace_personal_best = This is personal best pace[, up {pace_margin}].
on_pace_personal_best_2 = Personal best on the cards[, {pace_margin} up]. Bring it home.
on_pace_record = Track record pace[, up {pace_margin}]. Nail this one.
on_pace_record_2 = Record pace[, {pace_margin} up]. Don't leave anything out.

; the lap was worth mentioning
lap_invalidated = That lap didn't count.
lap_invalidated_2 = Lap's been struck out.
lap_invalidated_3 = No good, that one's gone.
fastest_lap_you = Fastest lap, nice work, {event_time}.
fastest_lap_you_2 = You're quickest, {event_time}.
fastest_lap_you_3 = That's the fastest of the session, {event_time}.
personal_best = New personal best, {event_time}.
personal_best_2 = That's a new best for you, {event_time}.
personal_best_3 = Personal best, {event_time}[, {gap_to_ideal} than your ideal].
record_beaten = New track record! {event_time}.
record_beaten_2 = Track record, {event_time}. That's the new benchmark.
session_best = Session best, {event_time}.
session_best_2 = Best of your session, {event_time}[, {gap_to_alltime} than your all time].

; the rider behind reaches your line
gap_behind = Behind, {gap_to_behind}[, {trend_behind} {gained_on_behind}].
gap_behind_2 = Behind you[, {rider_behind}], {gap_to_behind}[, {trend_behind} {gained_on_behind}].
gap_behind_3 = Behind you now, {gap_to_behind}[, {trend_behind} {gained_on_behind}].
; The one that says whether you can do anything about it: a gap tells you where
; they are, their last lap tells you which way it is going. Its own variant
; rather than a clause on the three above, so the rotation gains a line instead
; of every call getting longer.
gap_behind_4 = Behind, {gap_to_behind}[, they ran {last_lap_behind}].
;gap_behind_closing = Behind, {gap_to_behind}, and closing.
;gap_behind_dropping = Behind, {gap_to_behind}, dropping back.

; the session clock
; MUTED: the leader's white flag. Down the order you heard it and then your
; own last lap a lap later, and on the lead lap the two land seconds apart --
; two announcements of one moment you can only act on once. final_lap_you is
; the one about YOUR race and it fires whatever position you are in (the lap
; handler prefers it when you lead), so it is the one kept. Uncomment BOTH
; rows to hear the leader's flag as well.
;final_lap = Final lap.
;final_lap_2 = White flag, last lap for the leader.
final_lap_you = Last lap, make it count.
final_lap_you_2 = This is your last lap.
final_lap_you_3 = Last one[, {gap_to_ahead} to {rider_ahead}].
overtime_started = Overtime, {overtime_laps} after this one[, you're P {position}].
session_time_expired = Time's up.
session_time_expired_2 = That's time.
ten_minutes_remaining = Ten minutes to go.
ten_minutes_remaining_2 = Ten minutes left[, you're P {position}].
five_minutes_remaining = Five minutes left.
five_minutes_remaining_2 = Five to go[, P {position}].
halfway_point = Halfway there.
halfway_point_2 = Half distance[, you're P {position}].

; ============================================================================
; OPPONENTS - the rest of the field's race news
; ============================================================================
fastest_lap_other = Fastest lap, {event_rider}, {event_time}[, {event_gap_to_best_lap} than your best].
fastest_lap_other_2 = {event_rider} goes quickest, {event_time}.
leader_other = New leader, {event_rider}.
leader_other_2 = {event_rider} has the lead now.
leader_other_3 = Lead change, {event_rider} out front.
finished_leader = Leader's taken the flag.
finished_leader_2 = Flag's out, the leader's home.

;penalty_other = Penalty for {event_rider}, {penalty_seconds}.
;penalty_clear_other = Penalty cleared.
;penalty_change_other = {event_rider}'s penalty was revised.
;finished_other = {event_rider} has finished.
;retired_other = {event_rider} is out.
;disqualified_other = {event_rider} disqualified.
;pit_entry_other = {event_rider} is pitting.
;pit_exit_other = {event_rider} leaving pit.
;did_not_start_other = {event_rider} did not start.
;crashed_other = {event_rider} is down.
;spectate_target = Now watching {event_rider}.

; ============================================================================
; PROXIMITY - who is around you right now
; ============================================================================
; The most-heard lines in the pack, which is why they carry the most
; alternates - and why the two side calls carry short ones.
rider_behind = Rider behind.
rider_behind_2 = Someone's tucked in behind you.
rider_behind_3 = Company behind[, {rider_behind}].
rider_behind_4 = You've got a rider on you.
rider_behind_clear = Clear.
rider_behind_clear_2 = All clear behind.
rider_behind_clear_3 = Track's yours[, {gap_to_behind} back].
rider_left = Rider left.
rider_left_2 = Left side.
rider_left_3 = On your left.
rider_right = Rider right.
rider_right_2 = Right side.
rider_right_3 = On your right.
riders_both_sides = Riders both sides, hold your line.
riders_both_sides_2 = You're sandwiched, hold your line.
riders_both_sides_3 = Riders left and right.
; {event_rider} on these two is the rider the cue is ABOUT - the backmarker
; you are catching, and the rider closing to lap you. The other detector cues
; leave it empty, so a group naming it there always drops.
lapping_traffic = Backmarker ahead[, {event_rider}].
lapping_traffic_2 = Lapper ahead, pick your line.
lapping_traffic_3 = Traffic ahead[, {event_rider}].

; ============================================================================
; HAZARDS - what you cannot see coming
; ============================================================================
blue_flag = Blue flag, faster rider closing[, {event_rider}].
blue_flag_2 = Blue flag, let them by.
blue_flag_3 = Blue flag[, {event_rider} closing], hold your line and let them by.
hazard_ahead = Caution, rider down ahead.
hazard_ahead_2 = Rider down ahead, eyes up.
hazard_ahead_3 = Careful, someone's down on track ahead.
wrong_way_ahead = Heads up, wrong way rider ahead!
wrong_way_ahead_2 = Wrong way rider ahead, be ready.
