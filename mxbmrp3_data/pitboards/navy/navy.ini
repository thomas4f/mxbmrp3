; =============================================================================
; Navy -- a SKIN of the shipped classic board: this file plus background.tga.
;
; `base` names a pack to layer over. What this folder and this file state wins;
; what they leave out -- here, every row offset -- is answered from the base, so
; the rows sit exactly where classic puts them. Only the frame is recoloured;
; the white writing surface is untouched, so the rows stay the built-in black
; and this pack needs no [text] color.
;
; The hue is Husqvarna from the plugin's own BrandColors table, so a board and a
; gamepad of the same name match.
;
; A base must be a pack with no base of its own (in practice: a shipped one).
;
; TO MAKE YOUR OWN: copy this folder into
;   Documents\PiBoSo\MX Bikes\mxbmrp3\pitboards\<yourboard>\
; rename the .ini to match the folder, replace background.tga, and add [offset]
; keys only for rows your art puts somewhere else (classic.ini names them all).
; A board with a DARK writing surface also wants [text] color -- see classic.ini.
; =============================================================================

[board]
name = Navy
base = classic
