; =============================================================================
; Classic -- the shipped pit board.
;
; A pit board pack is the board artwork plus the numbers that place each row of
; text on it. Both live here because a board is only usable when they travel
; together: before packs, the picture went in textures\ while its offsets lived
; in the [PitboardHud_Layout_N] block of YOUR OWN settings file, so a board you
; drew could not be handed to anybody else.
;
; TO MAKE YOUR OWN: copy this folder to
;   Documents\PiBoSo\MX Bikes\mxbmrp3\pitboards\<yourboard>\
; rename the .ini to match the folder, replace background.tga, and adjust the
; offsets below until the rows sit where your art wants them. Then pick it in
; Settings > Pitboard. The RELOAD_CONFIG hotkey re-reads this file without
; restarting the game, which is what makes nudging rows bearable.
;
; Every key is optional; anything you leave out keeps its built-in value.
;
; TO RESKIN THIS PACK without copying it whole, see the shipped `crimson` and
; `lime` folders: `base = classic` makes a two-file pack that layers over this
; one, changing only the artwork.
; =============================================================================

[board]
; Shown in the Pitboard tab's Board control. Without it the folder name is
; title-cased.
name = Classic


; --- ART ---------------------------------------------------------------------
; background.tga's pixel size. Only the RATIO matters: it is what turns the
; panel's height (set by the row count and text size) into its width, so the
; board keeps its proportions instead of being stretched to fit the rows.
;
; You normally do not need this block at all -- the real size is read from the
; .tga itself. State it only to draw the board at proportions deliberately
; different from its own file.
;
; This is the one number that USED to be compiled in (1920/1080, named after
; this very file), which meant a board drawn at any other aspect was stretched
; and no offset below could correct it.
[art]
width  = 1920
height = 1080


; --- TEXT --------------------------------------------------------------------
; The colour every row (and the caption) is written in, as #rrggbb. It is part
; of the PACK because it has to contrast with this pack's own artwork -- a dark
; board states light text and stays readable whatever UI theme the user runs.
; Omitted here: the built-in default is this marker black already.
;[text]
;color = #000000


; --- OFFSETS -----------------------------------------------------------------
; Per-row nudges, as a FRACTION of the board's width/height: 0.01 is one percent
; of the board, whatever size it is drawn at. +x right, +y down.
;
; All zero means "use the built-in row positions", which is what this board
; wants -- its artwork was drawn around them. A pack only states an offset for a
; row its own art puts somewhere else, so most packs will list just a few.
[offset]
rider-id-x = 0.0
rider-id-y = 0.0
session-x  = 0.0
session-y  = 0.0
position-x = 0.0
position-y = 0.0
time-x     = 0.0
time-y     = 0.0
lap-x      = 0.0
lap-y      = 0.0
last-lap-x = 0.0
last-lap-y = 0.0
gap-x      = 0.0
gap-y      = 0.0
