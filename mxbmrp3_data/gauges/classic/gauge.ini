; =============================================================================
; Classic -- the shipped instrument faces.
;
; A gauges pack is two dial faces (tacho.tga, speedo.tga) plus the numbers that
; say what each face READS. Both live here because a face is only usable when
; they travel together: the ticks and figures are painted into the .tga, while
; the needle is placed from the range and sweep below. Before packs those were
; compiled into the plugin -- so a face you drew to any other ceiling got a
; needle that lied at every point but zero, and the only correct custom art was
; art that copied the shipped tick layout exactly.
;
; TO MAKE YOUR OWN: copy this folder to
;   Documents\PiBoSo\MX Bikes\mxbmrp3\gauges\<yourset>\
; keep the file named gauge.ini, replace tacho.tga and speedo.tga, and set the
; ranges below to whatever your faces are printed with. Then pick it in
; Settings > Widgets. The RELOAD_CONFIG hotkey re-reads this file without
; restarting the game, which is what makes lining a needle up bearable.
;
; Every key is optional; anything you leave out keeps its built-in value.
;
; TO RESKIN THIS PACK without copying it whole, `base = classic` makes a pack
; that layers over this one: state only the file you redraw and the numbers you
; change, and everything else is answered from here. That is also how you mix --
; a pack with `base = classic` and only its own tacho.tga is your tacho on the
; shipped speedo.
;
; ART: both faces are square (1024x1024 here) and drawn as a circle, so unlike a
; pit board there is no aspect to state -- only the scale below.
; =============================================================================

[pack]
; Shown in the Widgets tab's Gauges control. Without it the folder name is
; title-cased.
name = Classic


; --- TACHO -------------------------------------------------------------------
; What this face reads, end to end, in RPM, and where those two ends sit as
; angles: 0 is straight up, increasing clockwise. -158 to 142 is the 300-degree
; sweep with the gap at the bottom that both shipped faces are drawn with.
;
; `max` is the number worth checking first on any custom face -- and worth
; checking on this one for a game other than MX Bikes, because a road-racing
; bike will pin a 15000 face and a kart will not reach half of it.
[tacho]
min       = 0
max       = 15000
min-angle = -158
max-angle = 142

; The needle over this face, as fractions of the dial's drawn height: how far it
; reaches from the centre, and how thick it is. A long fine pointer suits an
; open face; a busy one wants a shorter, heavier needle.
needle-length = 0.42
needle-width  = 0.025

; #rrggbb, like a theme's colours. It belongs to the PACK because it has to
; contrast with this pack's own artwork -- a dark face states a light needle and
; stays readable whatever UI theme the user runs. Omitted here: the built-in
; default is this red already, which is what the shipped face was drawn for.
; A user who sets [TachoWidget] needleColor in their own settings file still
; wins; this is the pack's default, not a lock.
;needle-color = #ff0000


; --- SPEEDO ------------------------------------------------------------------
; The same vocabulary. `max` is in KM/H -- always, whatever unit the face is
; printed in, because that is the unit the widget clamps and smooths in. A face
; drawn in mph states `max-mph` instead and the plugin converts, so nobody has
; to do the arithmetic in their head and end up 60% out:
;
;   max-mph = 140      ; a 0-140 mph face
;
[speedo]
min       = 0
max       = 230
min-angle = -158
max-angle = 142

needle-length = 0.42
needle-width  = 0.025
;needle-color = #ff0000

; Where the odometer and trip-meter readouts sit, as a fraction of the dial's
; height from its top edge. These are here because this face has a window drawn
; for them -- art that puts its window somewhere else moves the digits to match
; instead of leaving them over the ticks. (Both readouts are switched on and off
; in Settings; the pack only says where they go.)
odometer-y  = 0.33
tripmeter-y = 0.66
