; =============================================================================
; DS4 Orange -- a SKIN of the shipped ds4 pack: this file plus
; background.tga.
;
; `base` names a pack to layer over. What this folder and this file state wins;
; what they leave out -- the sixteen button sprites and every measurement -- is
; answered from the base. Only the pad's body is recoloured, so the buttons and
; the geometry stay exactly as ds4 draws them.
;
; The hue is KTM from the plugin's own BrandColors table, so a gamepad and a
; pit board of the same name match.
;
; A base must be a pack with no base of its own (in practice: a shipped one).
;
; TO MAKE YOUR OWN: copy this folder into
;   Documents\PiBoSo\MX Bikes\mxbmrp3\gamepads\<yourskin>\
; keep the file named gamepad.ini, replace background.tga, done. Add any of
; the sixteen other .tga (names in the ds4 folder) only if you redraw them.
; =============================================================================

[pack]
name = DS4 Orange
base = ds4
