; =============================================================================
; DualShock 4.
;
; See gamepads/xbox/gamepad.ini for what each section means and how to author
; your own pack -- this file is the same vocabulary against a different
; photograph.
;
; It is also the clearest evidence that pad geometry is per-pad rather than
; shared: against the Xbox pack the artwork is a different size and shape, the
; triggers are half again as tall, the bumpers a third as tall, and the menu
; buttons sit nearly five times further apart. Essentially no number below is the
; same as its Xbox counterpart.
; =============================================================================

