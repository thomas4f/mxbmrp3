; =============================================================================
; Xbox One -- the shipped default pad.
;
; A pad pack is a photograph of a controller plus the numbers that say where the
; buttons sit on it. Both live here because neither is any use without the other:
; the art alone cannot place a stick, and these numbers mean nothing against a
; different picture.
;
; TO MAKE YOUR OWN: copy this folder under
;   Documents\PiBoSo\MX Bikes\mxbmrp3\gamepads\<yourpad>\
; keep the file named gamepad.ini, drop in your own .tga set (all 17 files,
; same names -- a pack missing one is skipped rather than drawn with a hole), and
; pick it in Settings > Gamepad. RELOAD_CONFIG re-reads this file without a
; restart, which is what makes nudging the offsets bearable.
;
; Every key is optional; anything you leave out keeps its built-in value.
;
; TO RESKIN THIS PACK without copying it whole, see any shipped `xbox-<colour>`
; folder: `base = xbox` makes a two-file pack that layers over this one,
; changing only the artwork.
; =============================================================================

[pack]
; Shown in the settings dropdown. Without it the folder name is title-cased.
name = Xbox One


; --- ART ---------------------------------------------------------------------
; background.tga's pixel size. Every [size] below is read as a RATIO against
; width, so re-exporting the art at a different resolution needs no other change
; here -- only these two numbers move.
[art]
width  = 750
height = 630


; --- SIZES -------------------------------------------------------------------
; Sprite sizes, in background.tga's own pixels. Measure them off the artwork.
[size]
trigger-w     = 89
trigger-h     = 61
bumper-w      = 171
bumper-h      = 63
dpad-w        = 32
dpad-h        = 53
face-button   = 47
menu-button-w = 33
menu-button-h = 33
stick         = 83


; --- OFFSETS -----------------------------------------------------------------
; Nudges applied after the base row layout, in authored normalized units: +x
; right, +y down. These are what actually seat each sprite in its socket on the
; photograph, so they are the numbers you will iterate on.
;
; They are spent through the widget's em (see hud/gamepad_geometry.h), so they
; hold their position when the UI font size or the widget's scale changes --
; which is exactly what they failed to do before that unit existed.
[offset]
left-trigger-x  =  0.041
left-trigger-y  =  0.0143
right-trigger-x = -0.041
right-trigger-y =  0.0143
left-bumper-x   = -0.01
left-bumper-y   =  0.0573
right-bumper-x  =  0.01
right-bumper-y  =  0.0573
left-stick-x    =  0.015
left-stick-y    =  0.0563
right-stick-x   = -0.049
right-stick-y   =  0.1263
dpad-x          =  0.0473
dpad-y          =  0.0408
face-buttons-x  = -0.0162
face-buttons-y  = -0.0343
menu-buttons-x  =  0.0004
menu-buttons-y  = -0.0393


; --- SPACING -----------------------------------------------------------------
; Multipliers on the gap within each button cluster. 1.0 is neutral; raise to
; spread a cluster, lower to tighten it.
[spacing]
dpad        = 0.95
face-button = 1.07
menu-button = 1.14
