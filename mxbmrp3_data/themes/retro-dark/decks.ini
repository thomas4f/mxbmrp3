; =============================================================================
; Retro -- the Retro themes' Regular deck layout: Cabinet's
; layout as a desktop window built on light and shade. The deck is the theme's
; raised panel, its name tab and stamp the theme's raised title bar, each
; meter sunk in the theme's card (a well).
; A SKIN: this file states only what it changes, so a layout fix in the base
; reaches it too. Cabinet Dark's decks.ini documents every key. The type is
; the theme's own (theme.ini's [fonts]), as on every HUD.
; =============================================================================

[pack]
base = cabinet-dark

; ---- SPEED -------------------------------------------------------------------

[speed-text-1]
color = primary

[speed-box-3]
art    = title
border = 0

[speed-box-4]
art    = title
border = 0

[speed-meter-1]
rect     = 0.75 8.546 18.5 0.643
well     = card
well-pad = 0.084

