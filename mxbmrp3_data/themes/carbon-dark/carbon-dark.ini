; =============================================================================
; Carbon Dark
;
; IBM Carbon, Gray 100. Square corners and one-pixel borders -- Carbon has no
; radius at all, which is the single thing that most makes it look like itself.
; Layers step up in grey rather than in tone, and the button is Blue 60 flat.
;
; Box terms are GRID CELLS in CSS shorthand: `2` all sides, `2 4` vertical
; horizontal, `1 2 3 4` top right bottom left. border is nine-slice art
; thickness (whole cells, 0-12; 0 = no border); margin and padding are air and
; may be fractional.
;
; The art is baked with this language's own surface colours, so [frame] tint is
; 0 -- tinting would multiply the HUD background through them and lose the
; palette this theme exists to carry.
; =============================================================================

[panel]                  ; The HUD itself; border art = frame_*.tga
border  = 1              ; Frame thickness (whole cells, 0-12; default 2)
padding = 0              ; Air inside the frame, before content (default 1)
gap     = 1              ; Air at each junction between stacked children (band/cards/buttons), never at the frame edges; one number (0-12, default 1)

[title]                  ; The caption's band; border art = card_*.tga
margin  = 0              ; Air outside the band (default 0)
border  = 1              ; Band corner size (whole cells; default: follows [content] border)
padding = 0              ; Air between band edge and caption glyph (default 0)

[content]                ; One card PER SECTION; border art = card_*.tga
margin  = 0              ; Air outside each card; the seam between two boxes is the SUM of facing margins (default 0)
border  = 1              ; Card corner size (whole cells, 0-12; default 1)
padding = 0              ; Air between card edge and rows (default 0)

[button]                 ; Footer buttons; border art = button_*.tga
; Button art is WHITE + alpha BY CONTRACT, unlike the frame/card art above:
; the engine tints it with the caller's colour because that colour carries
; STATE (a chip takes `accent`, the gap fill takes negative/positive). Baked
; Carbon blue here multiplied through the state colour - a red gap fill
; rendered navy. The blue lives in `accent` below instead.
margin  = 0              ; Air outside each button; the gap between two is the SUM (default 0)
border  = 1              ; Button corner size (whole cells, 0-12; default 1)
padding = 0 1            ; Air between button edge and label (default 0.5 1)

[frame]
tint = 0                 ; 0 = art keeps its own colours; 1 = white+alpha art recoloured by the HUD background (default 1)

[card]                   ; Draw the themed band / body card, per panel family (1 = on, 0 = off; default 1 band, 0 card)
hud-title-band      = 0  ; Tables and graphs: caption band
hud-content         = 1  ; Tables and graphs: body card
widget-title-band   = 0  ; Gauges: caption band
widget-content      = 1  ; Gauges: body card
settings-title-band = 0  ; The settings menu: header band
settings-content    = 1  ; The settings menu: section cards

[colors]
primary    = #f4f4f4
secondary  = #c6c6c6
tertiary   = #8d8d8d
muted      = #6f6f6f
background = #161616
; The semantic ramp is the PLUGIN's, not Carbon's status palette: green positive,
; orange warning, yellow neutral, red negative, matching the built-in defaults so
; a delta means the same thing whichever theme is on. Carbon's own status set puts
; yellow on caution and reserves blue for information, which read as "neutral is a
; different KIND of thing" beside a green and a red delta. The hues below are still
; Carbon's (Green 40, Orange 40, Yellow 30, Red 50) - only which slot each fills
; is ours. Blue stays on `accent`, where Carbon does use it.
positive   = #42be65
warning    = #ff832b
neutral    = #f1c21b
negative   = #fa4d56
accent     = #4589ff

[fonts]
title  = IBMPlexSans-Regular
normal = IBMPlexSans-Regular
strong = IBMPlexSans-Regular
digits = IBMPlexMono-Regular
marker = IBMPlexSans-Regular
small  = IBMPlexSans-Regular
