; =============================================================================
; Carbon -- the Carbon themes' Regular deck layout: Cabinet's
; layout in IBM Carbon's language. Square, one-pixel rims, layers stepping up
; in grey: the deck is the theme's panel, its name tab and stamp the theme's
; card (a layer-01 tag), its meters Carbon's flat track.
; A SKIN: this file states only what it changes, so a layout fix in the base
; reaches it too. Cabinet Dark's decks.ini documents every key. The type is
; the theme's own (theme.ini's [fonts]), as on every HUD.
; =============================================================================

[pack]
base = cabinet-dark

; ---- SPEED -------------------------------------------------------------------

[speed-text-1]
color = primary

[speed-box-3]
art    = card
border = 0

[speed-box-4]
art    = card
border = 0

[speed-meter-1]
gap = 0

