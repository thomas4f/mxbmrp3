; =============================================================================
; Modern Light
;
; A window-style theme: the caption is the frame's own TITLE BAR rather than a
; band inside the panel -- `[title] placement = frame` moves it there -- on a
; plain body with a one-pixel rim, in zinc greys. A LIGHT theme, so its text
; ramp is near-black: a HUD that runs with its background switched off (the
; gauges, the pit board) then draws dark text straight onto the track. Turn
; those backgrounds on, or use Modern Dark there.
;
; The bar is a flat LEFT-TO-RIGHT ramp, indigo to violet at a mid tone: strong
; enough to read as the bar against the body and the other light themes, light
; enough that dark caption text stays at 8:1 or more along its whole length
; (WCAG AA is 4.5:1).
; The ramp is art, not a renderer feature: the stretched middle column of
; title_*.tga carries it and the fixed-size corner columns carry its two ends,
; so the bar is one blend at any panel width. The bar has its OWN art set, so
; card_*.tga stays a quiet section card: square, the body's colour, a faint
; one-pixel rim.
;
; Box terms are GRID CELLS in CSS shorthand: `2` all sides, `2 4` vertical
; horizontal, `1 2 3 4` top right bottom left. border is nine-slice art
; thickness (whole cells, 0-12; 0 = no border); margin and padding are air and
; may be fractional. The master these slices were cut from is
; assets/themes/modern-light.png (tools/themeslice).
; =============================================================================

[panel]                  ; The HUD itself; border art = frame_*.tga
border  = 1              ; Frame thickness (whole cells, 0-12; default 2)
padding = 0              ; Air inside the frame, before content (default 1)
gap     = 1              ; Air at each junction between stacked children, never at the frame edges (0-12, default 1)

[title]                  ; The caption's band; border art = title_*.tga (else card_*.tga)
placement = frame        ; panel = a band inside the frame (default); frame = the frame's own top, a title bar
margin  = 0              ; Air outside the band (default 0)
border  = 1              ; Band corner size (whole cells; default: follows [content] border)
padding = 0 0.5          ; Air between band edge and caption glyph (default 0)

[content]                ; One card PER SECTION; border art = card_*.tga
margin  = 0              ; Air outside each card (default 0)
border  = 1              ; Card corner size (whole cells, 0-12; default 1)
padding = 0              ; Air between card edge and rows (default 0)

[button]                 ; Footer buttons; border art = button_*.tga (white + alpha by contract)
margin  = 0              ; Air outside each button; the gap between two is the SUM (default 0)
border  = 1              ; Button corner size (whole cells, 0-12; default 1)
padding = 0 1            ; Air between button edge and label (default 0.5 1)

[frame]
tint = 0                 ; 0 = art keeps its own colours (the gradient); 1 = recoloured by the HUD background

[card]                   ; 1 = on, 0 = off
hud-title-band      = 1  ; Tables and graphs: title bar
hud-content         = 1  ; Tables and graphs: body card
widget-title-band   = 1  ; Gauges: title bar
widget-content      = 1  ; Gauges: body card
settings-title-band = 1  ; The settings menu: title bar
settings-content    = 1  ; The settings menu: section cards

[colors]
primary    = #18181b
secondary  = #52525b
tertiary   = #71717a
muted      = #a1a1aa
background = #fafafa
; The semantic ramp as Carbon Light ships it: the plugin's hues, darkened to
; read on a light surface.
positive   = #198038
warning    = #ba4e00
neutral    = #8e6a00
negative   = #da1e28
accent     = #4f46e5

[fonts]
; Geist, a crisp present-day UI sans; Geist Mono for numbers. Titles and
; headings pick up Geist-SemiBold on their own (its emphasis cut).
title  = Geist-Regular
normal = Geist-Regular
strong = Geist-Regular
digits = GeistMono-Regular
marker = Geist-Regular
small  = Geist-Regular
