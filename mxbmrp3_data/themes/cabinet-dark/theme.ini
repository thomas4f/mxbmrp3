; =============================================================================
; Cabinet Dark
;
; An arcade cabinet: a dark rim with a one-pixel bevel inside it (light along
; the top and left, dark along the bottom and right) and 6 px corners. Buttons
; are raised chips. Tomorrow italic for text and figures, Audiowide captions.
;
; Box terms are GRID CELLS in CSS shorthand: `2` all sides, `2 4` vertical
; horizontal, `1 2 3 4` top right bottom left. border is nine-slice art
; thickness (whole cells, 0-12; 0 = no border); margin and padding are air and
; may be fractional. The geometry is Carbon's, so switching between the two
; never moves or resizes a HUD.
;
; The art is baked with this theme's own surface colours, so [frame] tint is
; 0. The master these slices were cut from is assets/themes/cabinet-dark.png
; (tools/themeslice).
; =============================================================================

[panel]                  ; The HUD itself; border art = frame_*.tga
border  = 1              ; Frame thickness (whole cells, 0-12; default 2)
padding = 0              ; Air inside the frame, before content (default 1)
gap     = 1              ; Air at each junction between stacked children (band/cards/buttons), never at the frame edges; one number (0-12, default 1)

[title]                  ; The caption's band; border art = title_*.tga (else card_*.tga)
;placement = panel       ; panel = a band inside the frame (default); frame = the frame's own top, a title bar
margin  = 0              ; Air outside the band (default 0)
border  = 1              ; Band corner size (whole cells; default: follows [content] border)
padding = 0              ; Air between band edge and caption glyph (default 0)

[content]                ; One card PER SECTION; border art = card_*.tga
margin  = 0              ; Air outside each card; the seam between two boxes is the SUM of facing margins (default 0)
border  = 1              ; Card corner size (whole cells, 0-12; default 1)
padding = 0              ; Air between card edge and rows (default 0)

[button]                 ; Footer buttons; border art = button_*.tga
; Button art is WHITE + alpha BY CONTRACT, unlike the frame/card art above:
; the engine tints it with the caller's colour because that colour carries
; STATE (a chip takes `accent`, the gap fill takes negative/positive). The
; chip's bevel and dark rim are greys: tinting multiplies, so they shade every
; state colour alike.
margin  = 0              ; Air outside each button; the gap between two is the SUM (default 0)
border  = 1              ; Button corner size (whole cells, 0-12; default 1)
padding = 0 1            ; Air between button edge and label (default 0.5 1)

[frame]
tint = 0                 ; 0 = art keeps its own colours; 1 = white+alpha art recoloured by the HUD background (default 1)

[card]                   ; Draw the themed band / body card, per panel family (1 = on, 0 = off; default 1 band, 0 card)
hud-title-band      = 0  ; Tables and graphs: caption band
hud-content         = 1  ; Tables and graphs: body card
widget-title-band   = 0  ; Gauges: caption band
widget-content      = 1  ; Gauges: body card
settings-title-band = 0  ; The settings menu: header band
settings-content    = 1  ; The settings menu: section cards

; OPTIONAL TITLE. The picker shows this theme's FOLDER name, title-cased, unless
; the theme says otherwise:
;
;   [pack]
;   name = MXB-Mods HD
;
; A label only -- the theme is still stored and selected by its folder name.
; `[pack]` is the same section every other pack type opens with, so this is
; one line you already know from writing a gamepad or a pit board.
; Absent, the derived title is used, so every theme written before this key
; reads exactly as it did.
;
[colors]
; Status colours keep the plugin's ramp (green positive, orange warning, yellow
; neutral, red negative) in this theme's own bright cuts; every text and status
; colour but muted is 4.5:1 or more on the background.
primary    = #f4f6fa
secondary  = #c6ccd8
tertiary   = #8e98aa
muted      = #5d6778
background = #10141e
positive   = #3ddc84
warning    = #ff9a3c
neutral    = #ffd04d
negative   = #ff4d5a
accent     = #35c8ff

[fonts]
title  = Tomorrow-BoldItalic
normal = Tomorrow-SemiBoldItalic
strong = Tomorrow-BoldItalic
digits = Tomorrow-BoldItalic
marker = Tomorrow-BoldItalic
small  = Audiowide-Regular
