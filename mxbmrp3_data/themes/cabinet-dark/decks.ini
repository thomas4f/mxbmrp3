;         artist: or why there is none; loop-one: the "1" while one track
;         repeats;
;         stamp: a new track, paused
[media]
size = 30, 10

[media-box-1]
rect = 0 1 30 9
art  = panel

[media-box-2]
rect           = 0 0.438 0.938 1.527
hug            = title
pad            = 0.758
color          = background
border         = 0.084
border-color   = muted
border-opacity = 0.8

[media-box-3]
rect           = 0 0.196 0.938 2.25
hug            = stamp
pad            = 0.852
when           = stamp
color          = background
border         = 0.084
border-color   = muted
border-opacity = 0.8

[media-box-7]
