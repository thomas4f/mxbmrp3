; =============================================================================
; Cabinet -- the shipped deck layout: rimmed cards, a name tab on the top
; edge, big italic figures and a meter along the bottom.
;
; A theme's decks.ini is its Regular deck layout (decks-slanted.ini its
; Slanted one): where each deck's boxes, texts and meters sit, and what
; paints them. Each deck here sits on the theme's own panel (art = panel: the
; one picked in Appearance, or the deck's own Theme on the Decks tab) and
; every colour is a palette slot, so the layout follows the theme, dark or
; light, with no art of its own. A theme with no layout draws its base
; theme's, else this one.
;
; TO MAKE YOUR OWN: put a decks.ini in your theme's folder,
;   Documents\PiBoSo\MX Bikes\mxbmrp3\themes\<yourtheme>\
; and change the numbers. Settings > Decks > Slanted picks decks-slanted.ini
; instead. The RELOAD_CONFIG hotkey re-reads this file without restarting
; the game, which is what makes nudging a text into place bearable.
;
; Every key is optional; anything you leave out keeps its built-in value,
; and a deck with no size is not drawn.
;
; TO RESKIN THIS LAYOUT without copying it whole, `base = cabinet-dark`
; under [pack] layers yours over this one: state only the sections and keys
; you change, and everything else is answered from here. A skin can itself be
; a base: Carbon's is this one's, and Carbon Light's is Carbon's.
;
; UNITS ARE THE THEMES'. A length is in GRID CELLS, as in theme.ini: a
; column across (one character's width) and a row down (half a line of
; text), 10.56 x 11.88 px at 1080p and the default font. x, w and anything
; measured across are columns; y, h and anything measured down are rows; a
; thickness or a radius, which has no one direction, is rows. Fractions are
; fine. Give a deck a whole number of cells, its card starting one row below
; the top (the name tab hangs in that row), and its edges land on the grid
; lines the classic HUDs snap to; a changed font size scales the whole deck
; with the grid. A font size is in text sizes, as the HUDs': 1 = the normal
; text, 0.75 small, 1.5 large, 2 extra large. An angle is gauge.ini's: 0 is
; straight up, increasing clockwise. Every position is from the deck's top
; left.
;
; Colours are palette slots and fonts are categories, so the decks follow the
; player's own: a colour or a font picked in Appearance (or on the deck) wins.
; Where they kept the default, a category draws in the theme's face for it,
; as every HUD does: the shipped layouts name no fonts. A slot they kept is
; the theme's colour: a layout has no palette.
;
; The Speed deck below has each key explained next to it. Every key:
;
;   [pack]            base = the theme whose layout this one changes (in
;                     decks-slanted.ini: `regular`, this theme's own)
;   [fonts]           <category> = <font file's name>: a layout's own face
;                     for a category, over the theme's (the shipped ones
;                     state none); in a skin, `theme` drops its base's
;   [<deck>]          size = columns, rows (a deck without one is not drawn)
;     <deck> = speed, race, timing, wheelie, slide, combo, gap, rival, spin,
;              inputs, standings, session, notice, fuel, media, laplog
;                     rows = a list deck's (standings, laplog) most rows;
;                     its row template is the boxes and texts with row = 1,
;                     drawn once per row, row-pitch rows apart, and
;                     row-break rows further down after a skip in the
;                     places; row-lean = columns each row moves left per
;                     row down (rows on one leaning card, as stack-lean)
;
;   SECTIONS ARE NAMED OR NUMBERED, and drawn in the file's order: boxes
;   first under last, then meters, then texts over all. A name
;   ([speed-box-plate], letters, digits and '-', up to 23 characters) takes
;   the next place after every element of its kind above it, so a box goes in
;   between two others by writing it between them; nothing is renumbered. A
;   number ([speed-box-3]) is that place outright. A skin's section of a name
;   (or number) its base has changes that element; a new one is added after
;   the base's. A deck holds 16 boxes, 24 texts and 4 meters.
;
;   [<deck>-box-N]    N = a name, or 1..16
;     rect    = x, y, w, h
;     corners = x,y x,y x,y x,y (TL, BL, BR, TR) instead of rect
;     skew    = columns the top edge leans right (negative: left); a leaning
;               box is always solid, and its edges step: paint a smooth lean
;               into an image instead
;     art     = solid | panel (the theme's panel) | card (its card) |
;               title (its title bar, else its card) | button (its button) |
;               none | image | icon (the deck's own icon, in its colour:
;               the notice's, the achievement's marker)
;     control = shuffle | prev | play | next | loop | volume (sets art =
;               control): a media button's icon over the box, in the colour
;               the deck gives its state; a click on the box presses it
;               (volume: the slider's icon, no button)
;     image   = deck_<name>.tga, by name without deck_ and .tga (sets art =
;               image): the first found in this theme's folder, then down
;               its layout's bases; stretched over the box, white art tinted
;               by color. The theme a deck draws in shows its own instead
;               (deck_<name>.tga in its folder, or its base theme's)
;     color   = a palette slot (primary, secondary, tertiary, muted,
;               background, positive, warning, neutral, negative, accent) or
;               #rrggbb; default background (button: accent)
;     opacity = its share of the deck's Opacity setting, 0..1
;     when    = a field: drawn only while that field shows something
;               (none: always - a skin clearing its base's)
;     tint    = 1: coloured by that field's tone (good, bad, hot...)
;     hug     = a field: the box spans that field's drawn text, `pad`
;               columns each side (rect gives its y and h): a badge fits
;               its word
;     hug-to  = a field drawn after the hug one: the box runs on to its end
;               (hug/hug-to = none: a fixed box - a skin clearing its base's)
;     border  = rows of rim inside the edge (0.0842 is a pixel at 1080p),
;               in border-color (default muted) at border-opacity
;     row     = 1: part of the deck's row template (rows above)
;     glow    = rows: a halo that far past the box while the deck raises one
;               (notice: one that calls for action), in its colour
;     caps    = 1: where the theme has slanted frame ends
;               (frame_slant_left/right.tga), the box draws the theme's frame
;               leaning instead: those ends, its top, centre and bottom
;               stretched between (Slant's cards)
;     uncapped = 1: drawn only where the theme has no slanted ends (a layout's
;               own outline, which the theme's frame replaces)
;
;   [<deck>-text-N]   N = a name, or 1..24, drawn over every box and meter
;     show    = the field (each deck's list is above its section)
;     x, y, h = the anchor x, and the band y .. y + h its ink is centred in;
;               a font whose figures stand taller than h is drawn smaller
;     size    = font size, in text sizes (1 = the normal text)
;     fit     = the widest it may run, columns: longer shrinks, then is cut
;               (a long translation); 0 = no limit
;     tail    = a share of size: from the first '/' or letter on ("3/22",
;               "2.4 s") drawn that much smaller on the same baseline
;     arrow   = up | down: a triangle before the text, in its colour
;     after   = a field listed earlier: start x columns past its end (left)
;     before  = a field anywhere in the list: end x columns short of its
;               start
;     pills   = 1: the deck's words each on a pill (pill-color at
;               pill-opacity, or pill-image tinted so; pill-border rows,
;               pill-border-color, pill-border-opacity: a rim on a plain
;               one; pill-pad columns each side, pill-h rows tall).
;               pill-tint = the opacity of a toned word's colour over its
;               pill (0: none). In a row, pill-gap rows apart: with a fit,
;               the newest that fit. stack = N: a column, the newest in the
;               band and each older one pill-h + pill-gap higher (stack-lean
;               columns right per row up); N stand, the next fades out as
;               it rises, a new one slides in below
;     align   = left | center | right (of x)
;     font    = title | normal | strong | digits | marker | small (the
;               player's pick for it, else the theme's face)
;     color, empty-color, hot-color, good-color, bad-color, best-color =
;               the colour for the field's tone (defaults primary, muted,
;               negative, positive, negative, positive)
;     row     = 1: part of the deck's row template (rows above)
;
;   [<deck>-meter-N]  N = a name, or 1..4, drawn over the boxes
;     show    = the meter (each deck's is above its section)
;     kind    = bar | blocks | arc | trace (its history as a line) |
;               column (filled from the bottom)
;     rect    = x, y, w, h (bar, blocks, trace, column)
;     arc     = centre x, centre y, radius, thickness (arc)
;     from, sweep = degrees, as gauge.ini's: 0 straight up, clockwise (arc)
;     count   = blocks; 0 = one per part the deck gives (a lap, a sector)
;     gap     = columns between blocks or parts (arc: degrees)
;     skew    = columns each block or part's top edge sits right of its
;               foot (bar, blocks): they lean and still meet
;     color, dim-color, hot-color, zone-color, good-color, bad-color,
;               danger-color (default negative: the Slide deck's last band;
;               the Combo deck lights its chain in color while a trick
;               turns, hot-color while the chain runs, danger-color as it
;               runs out, blinking)
;     dim-opacity = an unlit block's opacity, 0..1
;     line    = trace: the line's width, rows (default 0.17)
;     mid     = bar: a tick across the middle of a centred meter (gap,
;               rivals), this many columns wide, in mid-color; 0 = none
;     mark    = bar: each rider's mark (rivals), columns wide
;     over    = rows the tick and marks stand past the strip's top and
;               bottom (arc: the needle past the outer edge)
;     needle  = arc: a needle at the value, this many rows wide, from
;               needle-in rows inside the inner edge; needle-color while in
;               the plain run (default primary), else its band's colour,
;               dim-color while idle. Its deck lights only the band holding
;               the needle (tilt, slip)
;     knob    = bar, blocks: a notch at the value, columns wide, `over` past
;               the strip, while the meter drags (media: volume, track), in
;               knob-color (default accent; lighter under the pointer)
;     well    = bar, blocks, trace, column: a box under the strip, well-pad
;               rows bigger each side (its lean too), in the art a box takes
;               (solid, panel, card, title, button), well-color at the
;               deck's Opacity; well-image = an image instead, as a box's
;
;   SHOW, WHEN, HUG, AFTER, BEFORE name a field, and a meter's SHOW a meter,
;   of THAT deck: each deck's section below opens with the ones it fills.
;   Any other is ignored, with a line in the log naming the ones there are.
; =============================================================================

; ---- SPEED -----------------------------------------------------------------

; fields  title, stamp, gear, speed, unit, stance-up, stance-down
; meters  rpm
;         stance-up, stance-down: a triangle each (arrow), lit by stance;
;         empty until the game sends one
[speed]
size = 20, 10             ; 20 columns by 10 rows

[speed-box-1]
rect = 0 1 20 9           ; x, y, w, h: the card, a row below the top
art  = panel              ; the theme's panel

[speed-box-2]
rect    = 9.375 3.089 0.188 5.143 ; the divider: a fifth of a column wide
color   = muted           ; a palette slot, or #rrggbb
opacity = 0.45            ; a share of the deck's Opacity

[speed-box-3]
rect           = 0 0.438 0.961 1.527
hug            = title    ; the name tab spans the title's text
pad            = 0.758    ; columns each side of it
color          = background
border         = 0.084    ; rows: about a pixel at 1080p
border-color   = muted
border-opacity = 0.8

[speed-text-1]
show  = title             ; the field this text draws
x     = 2.062             ; columns from the left
y     = 0.438             ; rows from the top; the ink is centred
h     = 1.527             ; in the band y .. y + h (rows)
size  = 0.75              ; text sizes: 0.75 is the small text
font  = strong            ; a font category
color = accent
fit   = 8.653             ; columns: a longer title shrinks, then is cut

[speed-text-2]
show      = gear
x         = 4.808         ; align = center: the gear centres on x
y         = 3.402         ; the band is this layout's own digits' height:
h         = 4.75          ; a taller face shrinks to it, clear of the bar
size      = 5.2315        ; text sizes: about five normal texts tall
align     = center
font      = digits
color     = warning
hot-color = negative      ; its colour past the shift point

[speed-text-3]
show = speed
x    = 10.688
y    = 2.631
h    = 3.817
size = 2
font = digits
[speed-text-4]
show  = unit
x     = 10.688
y     = 5.701
h     = 1.43
size  = 0.75
font  = strong
color = secondary
fit   = 4.808

