; ---- LAP LOG ---------------------------------------------------------------
; The last laps, oldest on top, and the lap running at the foot: its number
; lit, the sectors it has crossed good or bad against your best. A lap or
; sector that is your best is lit; a pit or struck lap is muted.

; fields  title, stamp, row-lap, row-s1, row-s2, row-s3, row-time, row-me
; meters  none
;         row-*: each row's; row-s3 the rest of the lap (S3, or S3 + S4 on
;         GP Bikes); row-me set on the lap running
[laplog]
size      = 30, 10
rows      = 3
