; =============================================================================
; Slant -- the shipped Slanted deck layout: Cabinet's leaning about 10 degrees.
; A SKIN OF CABINET (`base = regular`: this theme's decks.ini): this file
; states only what Slant changes, so a layout fix in Cabinet reaches Slant
; too. decks.ini beside it documents every key.
;
; SLANT FOLLOWS THE THEME: each card is the theme's own frame leaning (`caps`:
; the theme's frame_slant_left/right.tga), its faces are the theme's, and a
; theme may repaint any picture here (deck_<name>.tga in its folder; a 1x1 one
; hides it, and the 1x1 wells here are drawn only where a theme paints them).
; Otherwise the deck_ pictures beside this file draw. The lean is painted into
; them (decks.ini: `skew` says why). Text stays upright: strings
; cannot lean.
; On the grid: every height is Cabinet's (whole cells) and the box's foot
; starts where Cabinet's does, so a deck snaps at its left and its top and
; bottom; the lean's tip overhangs the right by the slant, never whole cells.
; The lean (0.2 columns right per row up) runs 2 columns over one deck's 10 rows,
; so a deck snapped one down and two columns left continues the diagonal: every
; x nudge, skew and stack-lean here follows it. Pictures: cut from
; assets/themes/cabinet-dark.png (tools/themeslice).
; =============================================================================

