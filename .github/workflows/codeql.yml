# ============================================================================
# CodeQL static analysis.
#
# Complements the existing dynamic checks (ASan/UBSan, fuzzing) with GitHub's
# semantic static analysis:
#   c-cpp                — the plugin, extracted from the mingw cross-build
#                          (tests/integration/build.sh; CodeQL traces GCC-family
#                          compilers, which mingw-w64 g++ is). Same TU set the
#                          shipping MSVC build compiles.
#   javascript-typescript — the web overlay (mxbmrp3_data/web/js) + dev tools.
#                          No build needed.
#
# WHERE THIS RUNS: code scanning is free ONLY for public repositories — in the
# private repo it would require GitHub Advanced Security, so the job is gated
# to the PUBLIC mirror (thomas4f/mxbmrp3), where it runs on the mirrored
# release pushes, PRs, and a weekly schedule. In the private repo every run
# skips (same zero-minutes pattern as tests.yml).
# ============================================================================
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 2"     # Tuesdays 05:00 UTC — catches new query-pack findings
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Public mirror only: code scanning upload is not licensed on the private
    # repo (no Advanced Security), so even a manual dispatch would fail there.
    # Gated on the repo NAME, not github.event.repository.private like
    # tests.yml: this workflow also has a `schedule` trigger, and schedule
    # events carry no event.repository payload — the missing property reads as
    # null, and Actions' loose equality makes null == false TRUE, which would
    # run (and fail) the weekly cron in the metered private repo.
    if: github.repository == 'thomas4f/mxbmrp3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload SARIF results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # sarif-name: the analyze step names its output after the CANONICAL
          # language name (the action resolves the `c-cpp`/`javascript-typescript`
          # aliases to `cpp`/`javascript` — src/languages/builtin.json), so the
          # filter/upload steps must reference cpp.sarif / javascript.sarif, not
          # the alias used in `language:`.
          #
          # Same trap one step further out: the filename is
          # `<canonical><analysis.sarifExtension>`, and a SECOND analysis kind
          # emits a SECOND file. Adding `analysis-kinds: code-quality` would
          # produce `<lang>.quality.sarif` alongside this one, which the filter
          # and upload steps below would silently not cover — evaluated for 1.28
          # and not wired up (the C++ quality suite resolves to zero queries;
          # eslint covers the JS side in tests.yml at a fraction of the cost).
          - language: c-cpp
            build-mode: manual
            sarif-name: cpp
          - language: javascript-typescript
            build-mode: none
            sarif-name: javascript

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Install mingw-w64
        if: matrix.language == 'c-cpp'
        run: ./tools/install_deps.sh mingw

      # The same cross-build CI already runs for the Wine suite; CodeQL traces
      # the compiler invocations to build its database.
      #
      # CCACHE_DISABLE is load-bearing, not tidiness: CMakeLists.txt uses ccache as
      # a compiler launcher, and CodeQL only extracts TUs whose compiler actually
      # RAN. A cache hit is therefore an un-scanned file, and a fully warm cache
      # yields an empty database that analyzes to zero findings and uploads a clean
      # bill of health. This job happens not to restore a ccache today — that is
      # the only reason it works, and it must not silently become the reason it
      # stops. (The local gate, run_codeql.sh, sets this for the same reason and
      # additionally hard-fails on an empty database.)
      - name: Build (mingw cross-compile)
        if: matrix.language == 'c-cpp'
        env:
          CCACHE_DISABLE: 1
        run: ./tests/integration/build.sh

      # Analyze but DON'T upload yet: the SARIF goes through a path filter first.
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: sarif-results

      # Drop findings inside vendored third-party code. We don't patch cpp-httplib
      # et al., so their alerts are permanent noise that buries our own — e.g. the
      # cpp/non-https-url hit on httplib's proxy request-target builder, in a client
      # path this plugin never instantiates.
      #
      # NOTE: `paths-ignore` in the CodeQL config does NOT do this for c-cpp. It
      # only gates extraction for interpreted languages; for compiled ones the
      # build decides what gets extracted, so filtering has to happen on the SARIF.
      # This is the filter the CodeQL docs themselves point to for that case.
      - name: Filter vendored code out of results
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0  # v1.1
        with:
          patterns: |
            -mxbmrp3/vendor/**
            -tests/integration/harness/doctest.h
          input: sarif-results/${{ matrix.sarif-name }}.sarif
          output: sarif-results/${{ matrix.sarif-name }}.sarif

      - name: Upload filtered results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/${{ matrix.sarif-name }}.sarif
          category: "/language:${{ matrix.language }}"
