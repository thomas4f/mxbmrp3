# ============================================================================
# Regenerate usage_survey/ from Aptabase, unattended.
#
# Replaces the manual detour (log in -> export a month by hand -> copy the CSV
# to a machine with pandas -> run the generator -> commit) with a daily job.
#
# WHY DAILY IS AFFORDABLE HERE, given the rollup's gzip shards are rewritten
# wholesale and git cannot delta a compressed blob:
#   * The ROLLUP is only checkpointed on the 1st (or on demand). Every other run
#     passes --no-rollup-write, so the only things that can change are REPORT.md
#     and the SVGs - text, which git deltas well.
#   * analytics_report.py is DETERMINISTIC: re-rendering the same data reproduces
#     REPORT.md and every chart byte-for-byte. So a run with no new events
#     produces no diff, and the commit step below skips entirely.
#   * The fetch window comes from the rollup's own high-water mark, so a
#     checkpoint a month back just means a wider (still cheap) daily fetch -
#     ~1 MB of parquet per day - never a permanent hole.
# Committing the rollup on every run instead would add ~690 MB/year to a
# repository whose entire history is ~32 MB. That is the whole reason for the split.
#
# WHY IT ONLY RUNS PRIVATE: this needs the Aptabase session secret, and the
# public mirror receives usage_survey/ as part of mirror.yml's squashed tree
# anyway. Same zero-minutes skip pattern as tests.yml/codeql.yml.
#
# CREDENTIALS (repository secrets):
#   APTABASE_AUTH_SESSION  the `auth-session` cookie of a SHARED, READ-ONLY
#                          secondary Aptabase account - never the owner account.
#                          Aptabase enforces read-only server-side: every mutating
#                          route goes through an `owner_id = @userId` check, so a
#                          leak of this cookie cannot rename, delete, re-share or
#                          transfer the app. Revoke by removing the share; signing
#                          out does NOT invalidate it (stock ASP.NET cookie auth,
#                          no server-side ticket store, 365-day sliding expiry).
#
# CONFIG (repository VARIABLE, not a secret):
#   APTABASE_APP_ID        the app's NanoId from /api/_apps - NOT the A-EU-… key.
#                          Not a credential: every endpoint taking appId is behind
#                          IsAuthenticated + HasReadAccessToApp, so the id alone
#                          yields 401/403. It lives in a variable rather than
#                          hardcoded here only because mirror.yml publishes this
#                          whole tree, and in a variable rather than a secret so
#                          it is not masked to *** in the logs you debug with.
# ============================================================================
name: usage-survey

on:
  schedule:
    # 00:20 UTC daily. Off the hour on purpose: GitHub queues scheduled jobs
    # hardest at :00, and nothing here is time-critical.
    #
    # EARLY IN THE UTC DAY IS DELIBERATE - do not move this later, and never
    # across midnight. GitHub fires scheduled runs late under load, and the slip
    # is large and drifting: every cron in this repo went from ~+20-45 min in
    # August to +4h49 .. +6h29 in September. Starting at 00:20 buys two things.
    #   * The report is committed before a European morning even at +6h.
    #   * "Decide rollup mode" below tests the RUNNER's start date, not the time
    #     the schedule fired, so a slip that crosses midnight would read day 02
    #     and skip that month's checkpoint - silently, and the only symptom is a
    #     fetch window that never stops widening. At 00:20 there is ~23h40m of
    #     headroom before the date rolls; a cron at 23:00 would have one hour.
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill start YYYY-MM-DD (default: resume from the rollup)."
        type: string
        default: ""
      checkpoint:
        description: "Also write the rollup forward (automatic on the 1st)."
        type: boolean
        default: false
      dry_run:
        description: "Generate and diff, but commit nothing. Runs off the default branch never commit regardless."
        type: boolean
        default: true

# A slow backfill must never race the next nightly into the same branch.
concurrency:
  group: usage-survey
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'thomas4f/mxbmrp3-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # pandas + pyarrow + markdown-it-py only (the last renders the Pages copy,
      # index.html); the rest of requirements.txt is for the icon and minidump
      # tools and is not needed to build a report.
      - name: Install report dependencies
        run: python3 -m pip install --disable-pip-version-check pandas pyarrow markdown-it-py

      - name: Fetch new days from Aptabase
        env:
          APTABASE_AUTH_SESSION: ${{ secrets.APTABASE_AUTH_SESSION }}
          APTABASE_APP_ID: ${{ vars.APTABASE_APP_ID }}
          APTABASE_APP_NAME: mxbmrp3
          # Via env, never interpolated into the script: a `${{ }}` expansion of a
          # dispatch input lands in the shell as literal text, so an input carrying
          # shell metacharacters would execute. Quoting "$SINCE" cannot be escaped.
          SINCE: ${{ inputs.since }}
        run: |
          test -n "$APTABASE_AUTH_SESSION" || { echo "::error::APTABASE_AUTH_SESSION is not set"; exit 1; }
          test -n "$APTABASE_APP_ID"       || { echo "::error::APTABASE_APP_ID is not set (repository VARIABLE, not a secret)"; exit 1; }
          if [ -n "$SINCE" ]; then
            python3 tools/analytics_fetch.py --since "$SINCE"
          else
            python3 tools/analytics_fetch.py
          fi

      # Release download counts for the report's Downloads tile and table. Read from
      # the PUBLIC repo's releases (no secret needed; the token only lifts the rate
      # limit), into usage_survey/downloads.json beside the report it feeds.
      - name: Fetch release download counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/release_downloads.py
      # The rollup is checkpointed on the 1st, or when asked. Every other run
      # reads it and leaves it alone - see the header. `date -u` here is the
      # RUNNER's start date, which is what keeps the cron early in the UTC day -
      # see the schedule block.
      - name: Decide rollup mode
        id: mode
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          if [ "$CHECKPOINT" = "true" ] || [ "$(date -u +%d)" = "01" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "Checkpoint run: the rollup WILL be written forward."
          else
            echo "flag=--no-rollup-write" >> "$GITHUB_OUTPUT"
            echo "Report-only run: the rollup will not be touched."
          fi

      - name: Regenerate the report
        env:
          FLAG: ${{ steps.mode.outputs.flag }}
        run: |
          shopt -s nullglob
          files=(usage_survey/_exports/*.parquet usage_survey/_exports/*.csv)
          # $FLAG deliberately unquoted: empty must expand to zero arguments.
          python3 tools/analytics_report.py $FLAG "${files[@]}"

      # Stage first, then diff --cached: a plain `git diff` cannot see an ADDED
      # file, and the chart set grows (a new achievement, a new game). Staging
      # respects .gitignore, so the downloaded day files stay out.
      - name: Show what changed
        run: |
          git add -A usage_survey/
          git --no-pager diff --cached --stat -- usage_survey/

      # A run that commits nothing (a branch run, or a dry run) keeps its output
      # as a short-lived artifact instead, so a change to the report tool can be
      # previewed on fresh data before it is merged.
      - name: Keep the report as an artifact
        if: inputs.dry_run == true || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v7
        with:
          name: usage-survey-${{ github.sha }}
          path: |
            usage_survey/REPORT.md
            usage_survey/index.html
            usage_survey/badge.json
            usage_survey/downloads.json
            usage_survey/charts/
          retention-days: 3

      # ONE WRITER FOR A GENERATED ARTIFACT, and it is the default branch.
      # usage_survey/ is committed output, so a run on a feature branch and a run
      # on main write the same files from different data and every one of them
      # conflicts at merge time -- REPORT.md plus a dozen charts, none of which
      # can be merged by hand because none of them is hand-written. That happened
      # once and cost a merge; the fix is that only main ever commits.
      #
      # A branch run is still useful and still runs: it fetches, regenerates and
      # prints the diff in "Show what changed" above, which is the preview. It
      # just does not write. To see the rendered page for generator changes,
      # regenerate locally from the committed rollup - usage_survey/README.md has
      # the command, and it needs no Aptabase credentials.
      - name: Commit and push
        if: inputs.dry_run != true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --cached --quiet -- usage_survey/; then
            echo "No change - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update usage survey from Aptabase ($(date -u +%Y-%m-%d))"
          git push origin "HEAD:$BRANCH"
