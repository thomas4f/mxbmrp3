# ============================================================================
# Release build (Windows / MSVC + Linux packaging).
#   *** validate with a dry run before first real use ***
#
# Automates make_release.bat across TWO jobs:
#   build-release (windows-2022, VS 2022 / v143 toolset — see its runs-on):
#       compiles all three games with MSVC, stages the payload, and packages the
#       zip + debug symbols. This is the job that produces what users run.
#   package (ubuntu-latest): downloads that staging tree verbatim, builds the
#       NSIS installer over it, and publishes the artifacts / draft Release.
#
# The split is NOT arbitrary and not a cost optimisation: `Target AMD64-Unicode`
# needs an amd64 NSIS stub, and the official NSIS Windows distribution ships x86
# stubs only. See the `package` job's header for the full reasoning. Nothing is
# compiled on Linux — it only runs the packager over the MSVC artifacts.
#
# A REAL release runs the full test matrix first (the `tests` job below calls
# tests.yml) and build-release is gated on it — so a Release can NEVER be cut from
# a commit whose tests are red. The existence of a release IS the "tests passed"
# signal, and since tests.yml has no push trigger, this gate is the only thing
# standing between an untested commit and a published Release. Don't loosen it.
# A DRY RUN skips the tests (see the `tests` job's comment) — it validates the
# build and packaging path, which is the only thing a dry run is for.
#
# DON'T USE THIS TO CHECK WHETHER A BRANCH IS GREEN. Run the `tests` workflow
# directly — same coverage, none of the Windows runner (billed at 2x on the
# metered private repo). `tests` alone is ~19 billed Linux minutes, and the local
# `ctest` suite is free and covers everything except the CI Chromium, MSVC and
# packaging.
# This workflow is for validating the RELEASE PATH, which is worth doing twice:
# once as a dry run, once for real.
#
# TWO MODES — one entry point, the button (there is NO tag-push trigger; the tag is
# an OUTPUT of releasing, not a precondition, so it can never drift from resource.h):
#   • DRY RUN  — "Run workflow" (workflow_dispatch) with "Create draft release"
#                OFF. SKIPS the tests; builds, packages, uploads the zip +
#                installer + symbols as workflow ARTIFACTS. No Release, no tag.
#   • RELEASE  — "Run workflow" with "Create draft release" ON. Runs the full test
#                matrix, then everything above, PLUS
#                it auto-creates the vX.Y.Z tag (derived from resource.h) at the
#                dispatched commit and opens a DRAFT Release with every asset
#                attached. You review and hit Publish.
#
# BEFORE THE FIRST RUN:
#   1. Analytics keys — a Release (NDEBUG) build hard-errors without them. Add repo
#      Secrets APTABASE_KEY / GOATCOUNTER_TOKEN (Settings > Secrets and variables >
#      Actions). A keyless build is not wired. (GOATCOUNTER_CODE is NOT a secret —
#      the site code is public and hardcoded in plugin_constants.h; it's only an
#      optional override, not required.)
#   2. Code signing (the "unknown publisher" warning) is NOT handled here — add a
#      signing step once you have a certificate.
# ============================================================================
name: release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a DRAFT GitHub Release (auto-tags vX.Y.Z from resource.h). Off = dry run (artifacts only)."
        type: boolean
        default: false

permissions:
  contents: write   # needed to create the tag + GitHub Release

# Two simultaneous release dispatches would race the tag-existence check and could
# double-create the tag/artifacts. Queue them instead (never cancel a running
# release mid-build).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Pre-release gate: the full test matrix (unit + Wine integration + web overlay)
  # on this exact commit, via the reusable tests workflow. A REAL release cannot be
  # cut from a red commit — build-release's `if:` below enforces that.
  #
  # DRY RUNS SKIP IT (~19 billed Linux minutes saved per run). A dry run exists to
  # validate the BUILD AND PACKAGING path, not the tests: you get there by running
  # the `tests` workflow directly first, which is cheaper and is what you should be
  # doing to check a branch anyway. Skipping here only removes a duplicate.
  tests:
    if: inputs.release
    uses: ./.github/workflows/tests.yml
    with:
      full: true

  build-release:
    needs: tests
    # `needs: tests` alone would skip this whenever tests is skipped, so the
    # condition has to be explicit — and it is written to FAIL CLOSED. Read it as:
    # run only if the tests job passed, or was deliberately not run (dry run).
    # A tests result of 'failure' makes this false, so a real release still cannot
    # be built from a red commit; that is the invariant this file exists to hold.
    if: ${{ !cancelled() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    # PINNED, not `windows-latest`. GitHub rolled that label from Server 2022 to
    # Server 2025, which ships Visual Studio 2026 and NO VS 2022 — the configure
    # step died on "Generator Visual Studio 17 2022 could not find any instance of
    # Visual Studio", one dry run after the previous release had built fine on the
    # same line of YAML. The image label is part of the build definition here: this
    # job produces the DLL players inject into their game, statically linked (/MT),
    # so the CRT ships INSIDE it and a silent compiler roll is a silent change to
    # what users run. Pin it, and move to a newer toolset deliberately (bump this,
    # the generator below, and CMakePresets.json together, then test in-game).
    # windows-2022 is GA; when GitHub retires it this fails loudly, which is the
    # point.
    runs-on: windows-2022
    timeout-minutes: 40
    # Consumed by the `package` job, which finishes the release on Linux.
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    # NOTE: the two analytics secrets are scoped to the ONE build step that needs
    # them (see "Build All-Release") rather than job-level env — job-level env is
    # visible to every step, including the third-party actions below (setup-msbuild,
    # action-gh-release), which would make a hijacked action tag an exfiltration
    # path. For the same reason those two are pinned to full commit SHAs (the
    # trailing comment records the tag each SHA was resolved from — when bumping,
    # resolve the new tag's SHA and update both).
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the version's 4th component is `git rev-list --count
          # HEAD` (matches the DLL FILEVERSION stamp). A shallow clone would
          # count 1. Tags too, for reference.
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3.0.0

      - name: Derive version (resource.h + commit count)
        id: ver
        shell: pwsh
        run: |
          $h = Get-Content mxbmrp3\resource.h -Raw
          $maj = [regex]::Match($h, '(?m)^#define\s+VER_MAJOR\s+(\d+)').Groups[1].Value
          $min = [regex]::Match($h, '(?m)^#define\s+VER_MINOR\s+(\d+)').Groups[1].Value
          $pat = [regex]::Match($h, '(?m)^#define\s+VER_PATCH\s+(\d+)').Groups[1].Value
          $bld = (git rev-list --count HEAD).Trim()
          if (-not $maj) { Write-Error "could not read VER_MAJOR/MINOR/PATCH"; exit 1 }
          $version = "$maj.$min.$pat.$bld"
          $tag = "v$maj.$min.$pat"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release version: $version  (tag $tag)"
          # Release ("Create draft release" ON): the tag is auto-created from resource.h.
          # The auto-updater reads a vX.Y.Z tag as build 0, so reusing an X.Y.Z a user
          # already runs (their build is nonzero) would never reach them. Fail fast if the
          # tag already exists — bump VER_* in resource.h first. (A dry run skips this.)
          if ("${{ inputs.release }}" -eq "true") {
            git fetch --tags --quiet origin 2>$null
            if (git tag -l $tag) {
              Write-Error "Tag $tag already exists. Bump VER_MAJOR/MINOR/PATCH in mxbmrp3\resource.h before cutting a release (a reused vX.Y.Z won't reach users on that version)."
              exit 1
            }
          }

      - name: Build All-Release (MXB + GPB + KRP)
        shell: pwsh
        env:
          # The two secret keys mxbmrp3/CMakeLists.txt injects — step-scoped so no
          # other step (esp. third-party actions) sees them. Unset = keyless build,
          # which a Release config rejects unless MXBMRP3_ALLOW_NO_ANALYTICS is
          # defined. The GoatCounter *code* is public and hardcoded in
          # plugin_constants.h, so it is NOT a secret here.
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          # A Release (NDEBUG) build hard-errors unless the analytics keys are present.
          # They come from the two step-scoped env vars above (APTABASE_KEY /
          # GOATCOUNTER_TOKEN), which mxbmrp3/CMakeLists.txt turns into defines — set
          # two as repo Actions Secrets before running this (a keyless build is not
          # wired). The GoatCounter site code is public and hardcoded in
          # plugin_constants.h, so it's not needed here.
          # Configure AND build in this step: the analytics keys above are
          # step-scoped env, and CMake reads them at CONFIGURE time (MSBuild read
          # them per build). A tree configured without them builds keyless, which
          # plugin_constants.h then rejects with a #error.
          cmake -S . -B build/msvc -G "Visual Studio 17 2022" -A x64
          cmake --build build/msvc --config Release -- /m /v:minimal

      # Smoke-load the freshly built MSVC artifacts. The pre-release test gate
      # exercises the mingw TEST build under Wine — the MSVC .dlo users actually
      # run was never EXECUTED before shipping. LoadLibrary catches a corrupt or
      # mislinked artifact (broken DllMain/static-init, missing link dependency);
      # resolving the PiBoSo entry points catches an export-surface regression;
      # calling the constant getters (annotated api-guard-exempt — no plugin
      # state, cannot throw) verifies each DLL identifies as the right game.
      - name: Smoke-load built DLLs (LoadLibrary + export probe)
        shell: pwsh
        run: |
          $src = '
          using System;
          using System.Runtime.InteropServices;
          public static class K32 {
              [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Ansi, BestFitMapping=false)]
              public static extern IntPtr LoadLibraryA(string path);
              [DllImport("kernel32", CharSet=CharSet.Ansi, ExactSpelling=true)]
              public static extern IntPtr GetProcAddress(IntPtr h, string name);
          }
          public delegate IntPtr StrFn();
          public delegate int IntFn();
          '
          Add-Type -TypeDefinition $src
          $targets = @(
            @{ path = "build\MXB-Release\mxbmrp3.dlo";     modId = "mxbikes" },
            @{ path = "build\GPB-Release\mxbmrp3_gpb.dlo"; modId = "gpbikes" },
            @{ path = "build\KRP-Release\mxbmrp3_krp.dlo"; modId = "krp" }
          )
          $exports = "GetModID","GetModDataVersion","GetInterfaceVersion","Startup","Shutdown","EventInit","EventDeinit"
          foreach ($t in $targets) {
            $abs = (Resolve-Path $t.path).Path
            $h = [K32]::LoadLibraryA($abs)
            if ($h -eq [IntPtr]::Zero) {
              Write-Error "LoadLibrary FAILED for $($t.path) (Win32 error $([Runtime.InteropServices.Marshal]::GetLastWin32Error()))"; exit 1
            }
            foreach ($e in $exports) {
              if ([K32]::GetProcAddress($h, $e) -eq [IntPtr]::Zero) {
                Write-Error "$($t.path): export '$e' not found"; exit 1
              }
            }
            $modFn = [Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer([K32]::GetProcAddress($h, "GetModID"), [StrFn])
            $modId = [Runtime.InteropServices.Marshal]::PtrToStringAnsi($modFn.Invoke())
            if ($modId -ne $t.modId) {
              Write-Error "$($t.path): GetModID returned '$modId', expected '$($t.modId)'"; exit 1
            }
            $ifFn = [Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer([K32]::GetProcAddress($h, "GetInterfaceVersion"), [IntFn])
            # The test hooks must NOT be here. core/test_hooks.cpp is already
            # double-gated (mxbmrp3/CMakeLists.txt drops the TU from every
            # shipping target, and the file's body is #if MXBMRP3_TEST_BUILD),
            # but both gates are compile-time and neither is checked against the
            # ARTIFACT. This asserts the property on the actual .dlo users get:
            # a shipping DLL must not expose an internal-state backdoor.
            #
            # Probing three rather than one: a regression that re-adds the TU
            # brings back all 130 of them, and naming several makes the check
            # survive any single hook being renamed.
            #
            # Every name here is verified to EXIST in the test build. That is the
            # load-bearing part of a negative assertion: a probe for a symbol
            # that was deleted (MXBMRP3_Test_AllocCount, removed with the perf
            # probes in caaf0b5b) is absent from every DLL forever, so it passes
            # while testing nothing. If you edit this list, confirm the name
            # still appears in `nm --defined-only` on the test DLL.
            foreach ($th in "MXBMRP3_Test_CapturedSections","MXBMRP3_Test_ResolveFrame","MXBMRP3_Test_BenchmarkWidget") {
              if ([K32]::GetProcAddress($h, $th) -ne [IntPtr]::Zero) {
                Write-Error "$($t.path): TEST HOOK '$th' is exported from a shipping DLL"; exit 1
              }
            }
            Write-Host ("ok  {0,-36} modId={1,-8} interfaceVersion={2}  (no test hooks)" -f $t.path, $modId, $ifFn.Invoke())
          }

      - name: Stage + package (zip)
        id: pkg
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $out = "dist\mxbmrp3-v$ver"
          $stage = "dist\staging"
          New-Item -ItemType Directory -Force -Path $out, "$stage\mxbmrp3_data" | Out-Null
          Copy-Item -Recurse -Force mxbmrp3_data\* "$stage\mxbmrp3_data\"
          Copy-Item build\MXB-Release\mxbmrp3.dlo      "$stage\mxbmrp3.dlo"
          Copy-Item build\GPB-Release\mxbmrp3_gpb.dlo  "$stage\mxbmrp3_gpb.dlo"
          Copy-Item build\KRP-Release\mxbmrp3_krp.dlo  "$stage\mxbmrp3_krp.dlo"
          Copy-Item README.md, LICENSE, THIRD_PARTY_LICENSES.md $stage\
          # Render the manual-install guide from the shared template (same file
          # make_release.bat uses) so the CI zip and a local zip are identical.
          (Get-Content packaging\release_readme.txt) -replace '__VERSION__', $ver | Set-Content "$stage\README.txt"
          # Package with 7-Zip at max Deflate (-mx=9) rather than Compress-Archive's
          # Optimal — a smaller archive that is still a standard Deflate .zip Windows
          # Explorer can double-click-extract (matches make_release.bat's tool/level, so
          # the CI and local zips stay identical). A stronger method (solid LZMA, like the
          # installer) would need 7-Zip/WinRAR to open, so it's intentionally not used here.
          $outAbs = (Resolve-Path $out).Path
          Push-Location $stage
          & 7z a -tzip -mx=9 "$outAbs\mxbmrp3.zip" "*" | Out-Null
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { Write-Error "7z zip packaging failed (exit $rc)"; exit $rc }
          "outdir=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The staging Copy-Items above fail loudly on a missing FILE, but a path
      # bug that drops a whole subtree (e.g. a web/ subfolder not making it into
      # the recursive copy) would zip "successfully" and ship broken. Assert the
      # archive actually contains the release manifest: all three DLLs, the docs,
      # and sentinel files from the data subtrees users depend on.
      - name: Verify zip contents
        shell: pwsh
        run: |
          $zip = Join-Path "${{ steps.pkg.outputs.outdir }}" "mxbmrp3.zip"
          $listing = & 7z l $zip | Out-String
          $required = @(
            "mxbmrp3.dlo", "mxbmrp3_gpb.dlo", "mxbmrp3_krp.dlo",
            "README.txt", "LICENSE", "THIRD_PARTY_LICENSES.md",
            "mxbmrp3_data\web\index.html", "mxbmrp3_data\web\sw.js",
            "mxbmrp3_data\web\js\overlay-render.js",
            "mxbmrp3_data\fonts", "mxbmrp3_data\icons"
          )
          # Match either path separator: the zip stores forward slashes; 7-Zip's
          # listing usually shows backslashes on Windows, but don't bet the
          # release on which one this build prints.
          $missing = $required | Where-Object {
            $pat = [regex]::Escape($_) -replace '\\\\', '[\\/]'
            $listing -notmatch $pat
          }
          if ($missing) {
            Write-Error ("zip is missing required entries:`n  " + ($missing -join "`n  ")); exit 1
          }
          Write-Host "zip manifest ok ($($required.Count) required entries present)"

      # Archive the debug symbols (.pdb) + linker maps (.map) for all three games.
      # A crash reported by the analytics dashboard is just "mxbmrp3.dlo+0xNNNN" — an
      # RVA that only resolves to a function against the SYMBOLS FOR THAT EXACT BUILD.
      # Without this, the .pdb lives only on the build machine and the next rebuild
      # overwrites it, so a month-old crash offset becomes unresolvable. Zipped
      # because .pdb files are large; kept as a separate artifact so it never ships
      # inside the installer/zip that users download.
      - name: Package debug symbols (pdb + map)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $out = "${{ steps.pkg.outputs.outdir }}"
          $syms = Get-ChildItem -Path build\MXB-Release, build\GPB-Release, build\KRP-Release `
                    -Include *.pdb, *.map -Recurse -ErrorAction SilentlyContinue
          if (-not $syms) { Write-Error "no symbol files (.pdb/.map) found to archive"; exit 1 }
          Compress-Archive -Path $syms.FullName -DestinationPath "$out\mxbmrp3-symbols-v$ver.zip" -Force
          Write-Host "Symbols archived:"
          $syms | ForEach-Object { Write-Host ("  {0,-24} {1,6:N1} MB" -f $_.Name, ($_.Length/1MB)) }

      # CycloneDX SBOM of the third-party code inside the DLL, generated from
      # mxbmrp3/vendor/vendored.json (GitHub's dep graph can't see vendored C++).
      # Shipped libs are scope=required, test-only (doctest) scope=optional.
      - name: Generate SBOM (CycloneDX)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $out = "${{ steps.pkg.outputs.outdir }}"
          python tools\gen_sbom.py --version $ver --out "$out\mxbmrp3.cdx.json"

      # INTERNAL handoff to the `package` job, not the user-facing artifact — that
      # one is published there, once Setup.exe exists. Two paths: the built outputs
      # (zip + SBOM) and the staging tree makensis packages. Staging is the MSVC
      # payload verbatim: the three .dlo files this job just compiled, plus
      # mxbmrp3_data and the docs. Nothing is rebuilt downstream; Linux only runs
      # the packager over these exact bytes.
      - name: Upload payload for packaging
        uses: actions/upload-artifact@v7
        with:
          name: release-payload-v${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.pkg.outputs.outdir }}/mxbmrp3.zip
            ${{ steps.pkg.outputs.outdir }}/mxbmrp3.cdx.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload staging tree for the installer
        uses: actions/upload-artifact@v7
        with:
          name: release-staging-v${{ steps.ver.outputs.version }}
          path: dist/staging
          if-no-files-found: error
          retention-days: 1

      # Symbols as a SEPARATE artifact (not attached to the public Release): keep them
      # for triage without pushing large .pdb files at end users. Retained 90 days.
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: mxbmrp3-symbols-v${{ steps.ver.outputs.version }}
          path: ${{ steps.pkg.outputs.outdir }}/mxbmrp3-symbols-v${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error


  # ---------------------------------------------------------------------------
  # Package the installer and publish. LINUX, deliberately.
  #
  # WHY NOT ON THE WINDOWS JOB, where the payload is built: `Target AMD64-Unicode`
  # needs an amd64 stub, and the OFFICIAL NSIS Windows distribution does not ship
  # one. nsis-3.10.zip contains thirteen stubs and every one is `-x86-`; the
  # `Target` directive is understood by makensis, but the stub it needs has to be
  # cross-compiled from source. Debian/Ubuntu DO build them, which is why the
  # installer test has always produced a working amd64 Setup.exe here while the
  # Windows release job failed with:
  #     Error: reading stub ".../Stubs/lzma_solid-amd64-unicode"
  # A version assert cannot catch that — the runner really does have NSIS 3.10.
  #
  # Nothing is COMPILED here. The .dlo files are the MSVC artifacts from
  # build-release, downloaded verbatim; this job only runs the packager over them.
  # The mingw cross-build is a test configuration and never ships.
  #
  # Bonus property worth keeping: this is now the same toolchain
  # tests/integration/run_installer_test.sh exercises, so the installer we ship is
  # built the way the installer we test is built. Shipping a differently-built
  # artifact than the tested one is exactly how the amd64 stub gap reached a
  # release unnoticed.
  package:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install NSIS
        run: ./tools/install_deps.sh nsis

      # Fail with the REASON rather than NSIS's "reading stub" mid-compile error,
      # which reads like file corruption and cost a release to diagnose.
      - name: Verify the amd64 stub exists
        run: |
          stub=/usr/share/nsis/Stubs/lzma_solid-amd64-unicode
          if [ ! -f "$stub" ]; then
            echo "ERROR: $stub is missing - this NSIS build has no amd64 stub," >&2
            echo "       so 'Target AMD64-Unicode' in packaging/mxbmrp3.nsi cannot link." >&2
            echo "       Official NSIS ships x86 stubs ONLY; Debian/Ubuntu build the" >&2
            echo "       amd64 ones from source, which is why this job runs here." >&2
            exit 1
          fi
          echo "amd64 stub present: $(makensis -VERSION)"

      - name: Download staging tree (MSVC payload)
        uses: actions/download-artifact@v7
        with:
          name: release-staging-v${{ needs.build-release.outputs.version }}
          path: staging

      - name: Download built payload (zip + SBOM)
        uses: actions/download-artifact@v7
        with:
          name: release-payload-v${{ needs.build-release.outputs.version }}
          path: dist

      # Sanity-check the handoff before packaging: an artifact round-trip that
      # silently dropped the payload would otherwise produce a valid-looking
      # installer containing nothing.
      - name: Verify staging survived the round-trip
        run: |
          for f in mxbmrp3.dlo mxbmrp3_gpb.dlo mxbmrp3_krp.dlo \
                   mxbmrp3_data/web/index.html mxbmrp3_data/fonts; do
            [ -e "staging/$f" ] || { echo "ERROR: staging/$f missing after download" >&2; exit 1; }
          done
          echo "staging ok: $(du -sh staging | cut -f1)"

      - name: Build NSIS installer
        run: |
          ver="${{ needs.build-release.outputs.version }}"
          # NSIS resolves File/OutFile relative to the .nsi's own dir (packaging/),
          # not CWD - so pass ABSOLUTE paths for the staging source and output dir.
          makensis "-DPLUGIN_VERSION=$ver" \
                   "-DOUTPUT_DIR=$(pwd)/dist" \
                   "-DPLUGIN_SOURCE_PATH=$(pwd)/staging" \
                   packaging/mxbmrp3.nsi
          [ -f dist/mxbmrp3-Setup.exe ] || { echo "ERROR: Setup.exe not produced" >&2; exit 1; }
          file dist/mxbmrp3-Setup.exe

      # Always publish the zip + installer as downloadable workflow artifacts. This is
      # what makes a manual (workflow_dispatch) run on a branch a real DRY RUN: it
      # validates the whole MSVC build + NSIS packaging and hands you the files to
      # inspect / test-install, without creating a Release or a tag.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mxbmrp3-v${{ needs.build-release.outputs.version }}
          path: |
            dist/mxbmrp3-Setup.exe
            dist/mxbmrp3.zip
            dist/mxbmrp3.cdx.json
          if-no-files-found: error

      # The Release body IS the CHANGELOG.md section for this version — one text,
      # written once, for players. It replaced a hardcoded body plus
      # generate_release_notes, which on the PUBLIC repo listed a single squashed
      # "mirror" commit (see mirror.yml) and so said nothing useful.
      #
      # A dry run only WARNS on a missing section; a real release FAILS. That is
      # what keeps the changelog from rotting: you cannot ship a version that
      # isn't written up, and you find out at the dry run, not at the release.
      #
      # Parsed inline rather than with a changelog-reader Action: the format is a
      # fixed heading and the parse is ten lines, so a third-party action here
      # would buy nothing and put an outside dependency on the path that composes
      # what users read on the download page. Values arrive as env vars, never as
      # ${{ }} interpolated into the script body — the same reason.
      - name: Build release notes from CHANGELOG.md
        shell: python
        env:
          TAG: ${{ needs.build-release.outputs.tag }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTES: ${{ runner.temp }}/release_notes.md
          STRICT: ${{ inputs.release }}
        run: |
          import os
          import re
          import sys

          # KEPT after this step moved from the Windows runner to Linux, where
          # stdout is UTF-8 and this is a no-op. It is not dead weight: on
          # Windows, Python's stdout defaults to the locale codepage (cp1252),
          # and the print() at the end that echoes the notes into the job log
          # died on the release body's own leading "✅" with
          # UnicodeEncodeError — failing the step after a clean 15-minute build.
          # One line to keep that from coming back if this ever moves again.
          sys.stdout.reconfigure(encoding="utf-8")

          ver = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # Keep a Changelog heading: `## [1.27.8] - 2026-07-26`. The body runs to
          # the next `## `, or — for the OLDEST entry, which has no next version —
          # to the trailing `[x.y.z]: <url>` link-reference block, which would
          # otherwise be pasted into the release notes verbatim.
          m = re.search(r"^## \[" + re.escape(ver) + r"\][^\n]*\n"
                        r"(.*?)(?=^## |^\[[^\]]+\]:|\Z)", text, re.S | re.M)
          notes = m.group(1).strip() if m else ""
          if not notes:
              why = ("CHANGELOG.md has no entries under '## [%s]'. Move the "
                     "[Unreleased] section under the new version heading." % ver)
              if os.environ["STRICT"] == "true":
                  sys.exit("::error::" + why)
              print("::warning::" + why + " (dry run — not blocking)")
              notes = "_No changelog section for %s._" % ver

          # Built line-by-line rather than as one triple-quoted literal: YAML
          # block scalars strip the block's own indentation, so a multi-line
          # string here reads differently in the file than Python receives it.
          body = "\n".join([
              notes,
              "",
              "### Downloads",
              "",
              "| File | For |",
              "|------|-----|",
              "| `mxbmrp3-Setup.exe` | Guided installer (recommended) |",
              "| `mxbmrp3.zip` | Manual install |",
              "| `mxbmrp3.cdx.json` | CycloneDX SBOM — third-party components "
              "inside the DLL |",
              "",
              "✅ Built from `%s` with the full test suite passing — "
              "[run log](%s)." % (os.environ["SHA"], os.environ["RUN_URL"]),
              "",
          ])

          with open(os.environ["NOTES"], "w", encoding="utf-8") as fh:
              fh.write(body)
          print(body)

      # Cut a DRAFT Release when the button was run with "Create draft release" ON.
      # A plain dry-run dispatch stops at the artifacts above. action-gh-release
      # creates the vX.Y.Z tag (from resource.h) at this commit, since a Release must
      # be tag-backed — so the tag is a byproduct of releasing, never a manual step.
      # draft:true means it waits for you to Publish; the body comes from the step
      # above (changelog section + assets + build provenance), and
      # fail_on_unmatched_files means the job errors rather than shipping a
      # release missing a file.
      - name: Create draft GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          name: MXBMRP3 ${{ needs.build-release.outputs.tag }}
          tag_name: ${{ needs.build-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # OFF deliberately: on the public repo every release is one squashed
          # mirror commit, so the auto-generated list is a single meaningless
          # line. body_path carries the human-written notes instead.
          generate_release_notes: false
          draft: true          # opens as a draft so you review before publishing
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release_notes.md
          # Debug symbols are deliberately NOT attached to the public Release — they
          # ship only as the "mxbmrp3-symbols-*" workflow artifact (see the upload
          # step above) for crash triage. Attaching the symbols .zip here put a
          # SECOND .zip on the release, and the in-plugin auto-updater's asset
          # selector picked it (it sorts before mxbmrp3.zip), so every client's
          # update aborted with "Release not for this game". Keep this list free of
          # any .zip other than mxbmrp3.zip.
          files: |
            dist/mxbmrp3-Setup.exe
            dist/mxbmrp3.zip
            dist/mxbmrp3.cdx.json
