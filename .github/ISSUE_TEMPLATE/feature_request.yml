name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like, and why?
      description: >-
        Describe the feature and the situation where you'd use it. If it's about
        an existing HUD/widget/overlay element, name it — and note that many
        things are already configurable (settings UI, INI keys, web overlay
        settings, custom.css), so it's worth a quick look at the README first.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried (optional)
      description: Anything you tried that almost works — helps scope the gap.
