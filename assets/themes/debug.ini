; =============================================================================
; Debug -- not a look, a measuring instrument. Every slice of every set is its
; own flat colour: POSITION is hue (top-left RED, top edge CYAN, top-right
; GREEN, left ORANGE, centre DARK GREY, right VIOLET, bottom-left BLUE, bottom
; edge MAGENTA, bottom-right YELLOW), LAYER is brightness (FULL = [frame],
; HALF = [card] bands and body cards, TINTED = [button], which biases the
; caller's state colour rather than replacing it). Each corner and edge
; carries a brighter band on its OUTER side; a band pointing inward means that
; FILE is authored wrong, and its colour says which one. Colours are baked
; (tint = 0) so the HUD background cannot multiply them away. Values below are
; deliberately larger than a real theme's, so each band is thick enough to
; see; press the Reload Config hotkey to watch an edit move.
;
; Box terms are GRID CELLS in CSS shorthand: `2` all sides, `2 4` vertical
; horizontal, `1 2 3 4` top right bottom left. border is nine-slice art
; thickness (whole cells, 0-12; 0 = no border); margin and padding are air and
; may be fractional. A commented key shows its built-in default; uncomment to
; override it (an absent key keeps FOLLOWING the built-in if that is retuned).
; =============================================================================

[panel]                  ; The HUD itself; border art = frame_*.tga
border  = 2              ; Frame thickness (whole cells, 0-12; default 2)
padding = 2              ; Air inside the frame, before content (default 2)
;gap     = 0             ; Air at each junction between stacked children (band/cards/buttons), never at the frame edges; one number (0-12, default 0)

[title]                  ; The caption's band; border art = card_*.tga
margin  = 0              ; Air outside the band (default 0)
border  = 1              ; Band corner size (whole cells; default: follows [content] border)
padding = 0.5            ; Air between band edge and caption glyph (default 0.5)

[content]                ; One card PER SECTION; border art = card_*.tga
margin  = 0.5            ; Air outside each card; the seam between two boxes is the SUM of facing margins (default 0.5)
border  = 1              ; Card corner size (whole cells, 0-12; default 1)
padding = 0              ; Air between card edge and rows (default 0)

[button]                 ; Footer buttons; border art = button_*.tga
margin  = 0.5            ; Air outside each button; the gap between two is the SUM (default 0.5)
border  = 1              ; Button corner size (whole cells, 0-12; default 1)
padding = 0.5            ; Air between button edge and label (default 0.5)

[frame]
tint = 0                 ; 0 = art keeps its own colours; 1 = white+alpha art recoloured by the HUD background (default 1)

[card]                   ; Draw the themed band / body card, per panel family (1 = on, 0 = off; default 1 band, 0 card)
hud-title-band      = 1  ; Tables and graphs: caption band
hud-content         = 1  ; Tables and graphs: body card
widget-title-band   = 1  ; Gauges: caption band (set one switch to 0 to see what a family IS)
widget-content      = 1  ; Gauges: body card
settings-title-band = 1  ; The settings menu: header band
settings-content    = 1  ; The settings menu: section cards

[colors]                 ; The built-in defaults, spelled out: this theme must not change the text while you measure the chrome
primary    = #ffffff     ; Text ramp, loudest
secondary  = #bebebe     ; Text ramp, second
tertiary   = #8c8c8c     ; Text ramp, third
muted      = #646464     ; Text ramp, quietest
background = #000000     ; Flat fills (chart plots, bars); not the themed frame
positive   = #00ff00     ; Faster / gain / save
warning    = #ffa500     ; Caution states
neutral    = #ffff00     ; Informational states
negative   = #ff0000     ; Slower / loss / danger
accent     = #ff69b4     ; Highlights and hover

[fonts]                  ; The built-in defaults, for the same reason the palette is
title  = EnterSansman-Italic
normal = RobotoMono-Regular
strong = RobotoMono-Bold
digits = RobotoMono-Regular
marker = FuzzyBubbles-Regular
small  = Tiny5-Regular
