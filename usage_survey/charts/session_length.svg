</style><text x="12" y="20" class="title">Session length</text><text x="12" y="37" class="sub">sessions reporting a duration</text><line x1="61" y1="260" x2="744" y2="260" class="axis"/><line x1="61" y1="209.5" x2="744" y2="209.5" class="grid" stroke-dasharray="3 3"/><text x="55" y="213.5" class="sub" text-anchor="end">25,000</text><line x1="61" y1="159.0" x2="744" y2="159.0" class="grid" stroke-dasharray="3 3"/><text x="55" y="163.0" class="sub" text-anchor="end">50,000</text><line x1="61" y1="108.5" x2="744" y2="108.5" class="grid" stroke-dasharray="3 3"/><text x="55" y="112.5" class="sub" text-anchor="end">75,000</text><line x1="61" y1="58.0" x2="744" y2="58.0" class="grid" stroke-dasharray="3 3"/><text x="55" y="62.0" class="sub" text-anchor="end">100,000</text><rect x="74.7" y="145.3" width="70.3" height="114.7" rx="2" fill="#3fb950" data-tip="&lt;1 min: 11% (56,801)"/><text x="109.8" y="274" class="sub" text-anchor="middle">&lt;1 min</text><rect x="172.2" y="79.6" width="70.3" height="180.4" rx="2" fill="#3fb950" data-tip="1-5: 18% (89,323)"/><text x="207.4" y="274" class="sub" text-anchor="middle">1-5</text><rect x="269.8" y="61.3" width="70.3" height="198.7" rx="2" fill="#3fb950" data-tip="5-15: 20% (98,343)"/><text x="304.9" y="274" class="sub" text-anchor="middle">5-15</text><rect x="367.4" y="62.0" width="70.3" height="198.0" rx="2" fill="#3fb950" data-tip="15-30: 20% (98,038)"/><text x="402.5" y="274" class="sub" text-anchor="middle">15-30</text><rect x="464.9" y="83.2" width="70.3" height="176.8" rx="2" fill="#3fb950" data-tip="30-60: 17% (87,501)"/><text x="500.1" y="274" class="sub" text-anchor="middle">30-60</text><rect x="562.5" y="162.8" width="70.3" height="97.2" rx="2" fill="#3fb950" data-tip="1-2 h: 10% (48,106)"/><text x="597.6" y="274" class="sub" text-anchor="middle">1-2 h</text><rect x="660.1" y="211.4" width="70.3" height="48.6" rx="2" fill="#3fb950" data-tip="2 h+: 5% (24,072)"/><text x="695.2" y="274" class="sub" text-anchor="middle">2 h+